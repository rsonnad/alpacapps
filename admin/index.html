<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin — AlpacAPPs</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../favicon.png">
  <!-- Bare /admin/ entry point. Redirects to the Admin section of the intranet TOC.
       Kept so deep links to /admin/ resolve to a real page instead of a
       GitHub Pages 404. -->
  <script>
    var loc = window.location;
    var target = '/intranet/' + (loc.search || '') + (loc.hash || '#sec-admin');
    window.location.replace(target);
  </script>
  <meta http-equiv="refresh" content="0; url=/intranet/#sec-admin">
</head>
<body>
  <noscript>
    <p>Redirecting to <a href="/intranet/#sec-admin">the intranet</a>…</p>
  </noscript>
</body>
</html>
