<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Test Suite - AlpacAPPs Admin</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <script>try{var c=localStorage.getItem("genalpaca-cached-auth");if(c&&JSON.parse(c).appUser)document.documentElement.dataset.cachedAuth="1"}catch(e){}</script>
  <style>.hidden{display:none!important}[data-cached-auth] #loadingOverlay{opacity:0!important;pointer-events:none!important;visibility:hidden!important}[data-cached-auth] #appContent.hidden{display:block!important}#loadingOverlay{position:fixed;inset:0;background:#f6f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .16s ease-out}.loading-overlay__logo{display:flex;align-items:center;gap:.75rem;min-height:40px}.loading-overlay__icon{height:40px;width:auto;max-width:none}.loading-overlay__wordmark{height:28px;width:auto;max-width:none}</style>
  <link rel="stylesheet" href="/rentals/styles.css?v=5">
  <link rel="stylesheet" href="/rentals/admin/styles.css?v=5">
  <link rel="stylesheet" href="/rentals/admin/manage-shared.css?v=5">
  <link rel="stylesheet" href="../styles/site.css">
  <link rel="stylesheet" href="../styles/tailwind.out.css">
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-overlay__logo">
      <img src="https://pub-5a7344c4dab2467eb917ff4b897e066d.r2.dev/housephotos/logos/alpaca-head-black-transparent.png" alt="" class="loading-overlay__icon" width="28" height="40" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 21 30%22%3E%3Cpath d=%22M10.5 1.5C8.3 1.5 6.5 3.3 6.5 5.5v4.1L3.8 13c-1 1.3-1.5 2.8-1.5 4.4 0 4.6 3.7 8.3 8.2 8.3s8.2-3.7 8.2-8.3c0-1.6-.5-3.2-1.5-4.4l-2.7-3.4V5.5c0-2.2-1.8-4-4-4z%22 fill=%22%231f1720%22/%3E%3Cellipse cx=%2210.5%22 cy=%2218.6%22 rx=%223.1%22 ry=%224.7%22 fill=%22%23f6f5f0%22/%3E%3C/svg%3E'">
      <img src="https://pub-5a7344c4dab2467eb917ff4b897e066d.r2.dev/housephotos/logos/wordmark-black-transparent.png" alt="Alpaca Playhouse" class="loading-overlay__wordmark" width="28" height="28" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 28%22%3E%3Ctext x=%220%22 y=%2220%22 font-size=%2216%22 font-family=%22Arial,sans-serif%22 fill=%22%231f1720%22%3EAlpaca%3C/text%3E%3C/svg%3E'">
    </div>
    <div class="spinner spinner--sm"></div>
  </div>

  <div id="unauthorizedOverlay" class="loading-overlay hidden"></div>

  <div id="appContent" class="hidden">
    <div id="siteHeader"></div>
    <span data-site-version style="display:none">v260902.18 10:12p</span>

    <div class="context-switcher hidden" id="contextSwitcher">
      <a href="/residents/" class="context-switcher-btn">Resident</a>
      <a class="context-switcher-btn active">Staff</a>
    </div>

    <div class="manage-tabs" id="tabNav"></div>

    <main class="manage-content p-aap-4 md:p-aap-6 max-w-5xl mx-auto">
      <!-- Header -->
      <section class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-aap-3 mb-aap-6">
        <div>
          <h1 class="text-aap-2xl font-aap-bold text-aap-dark leading-aap-tight">Test Suite</h1>
          <p class="text-aap-sm text-aap-text-muted mt-aap-1">Nightly health checks via Hermes agent</p>
        </div>
        <div class="flex items-center gap-aap-2">
          <select id="categoryFilter" class="text-aap-sm border border-aap-border rounded-aap px-aap-3 py-aap-2 bg-aap-cream text-aap-text">
            <option value="">All categories</option>
            <option value="infra">Infra</option>
            <option value="email">Email</option>
            <option value="devices">Devices</option>
            <option value="ai">AI</option>
            <option value="app">App</option>
          </select>
          <button id="runAllBtn" class="inline-flex items-center gap-aap-1 px-aap-4 py-aap-2 bg-aap-amber text-aap-text-light text-aap-sm font-aap-semibold rounded-aap hover:bg-aap-amber-hover transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5.5 3v10l7-5z"/></svg>
            Run All
          </button>
        </div>
      </section>

      <!-- Summary cards -->
      <section id="summaryCards" class="grid grid-cols-2 sm:grid-cols-4 gap-aap-3 mb-aap-6">
        <div class="bg-white rounded-aap shadow-aap-sm p-aap-4 text-center">
          <p class="text-aap-2xl font-aap-bold text-aap-dark" id="statTotal">--</p>
          <p class="text-aap-xs text-aap-text-muted uppercase tracking-wide">Total</p>
        </div>
        <div class="bg-aap-success-light rounded-aap shadow-aap-sm p-aap-4 text-center">
          <p class="text-aap-2xl font-aap-bold text-aap-success" id="statPass">--</p>
          <p class="text-aap-xs text-aap-text-muted uppercase tracking-wide">Passed</p>
        </div>
        <div class="bg-aap-error-light rounded-aap shadow-aap-sm p-aap-4 text-center">
          <p class="text-aap-2xl font-aap-bold text-aap-error" id="statFail">--</p>
          <p class="text-aap-xs text-aap-text-muted uppercase tracking-wide">Failed</p>
        </div>
        <div class="bg-aap-warning-light rounded-aap shadow-aap-sm p-aap-4 text-center">
          <p class="text-aap-2xl font-aap-bold text-aap-warning" id="statWarn">--</p>
          <p class="text-aap-xs text-aap-text-muted uppercase tracking-wide">Warnings</p>
        </div>
      </section>

      <!-- Last run info -->
      <div class="flex items-center gap-aap-2 mb-aap-4 text-aap-sm text-aap-text-muted" id="lastRunInfo">
        <span id="lastRunTime">No runs yet</span>
      </div>

      <!-- Test results -->
      <section id="testResults" class="space-y-aap-2">
        <div class="text-center py-aap-8 text-aap-text-muted">Loading latest results...</div>
      </section>

      <!-- Run history -->
      <section class="mt-aap-8">
        <h2 class="text-aap-lg font-aap-semibold text-aap-dark mb-aap-3">Run History (Last 14 Days)</h2>
        <div id="runHistory" class="space-y-aap-2">
          <div class="text-center py-aap-4 text-aap-text-muted text-aap-sm">Loading...</div>
        </div>
      </section>
    </main>
  </div>

  <script src="../shared/instant-chrome.js"></script>
  <script type="module" src="../shared/version-info.js"></script>
  <script src="/vendor/supabase-js-2.39.3.min.js"></script>
  <script type="module" src="test-suite.js"></script>
</body>
</html>
