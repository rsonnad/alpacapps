  <style>
    /* SHFuego page styles — financial content uses sans-serif per PATTERNS.md */
    .sh-page { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .sh-header { margin-bottom: 2rem; }
    .sh-header h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.25rem; color: var(--text, #2a1f23); }
    .sh-header .sh-subtitle { font-size: 0.85rem; color: var(--text-muted, #7d6f74); }
    .sh-back { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: var(--text-muted); text-decoration: none; margin-bottom: 1rem; }
    .sh-back:hover { color: var(--accent, #c8956c); }

    /* Summary cards */
    .sh-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .sh-card { background: var(--bg-card, #fff); border: 1px solid var(--border, #e6e2d9); border-radius: var(--radius, 8px); padding: 1rem 1.25rem; }
    .sh-card-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 0.35rem; }
    .sh-card-value { font-size: 1.5rem; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .sh-card-value.positive { color: #16a34a; }
    .sh-card-value.negative { color: #dc2626; }
    .sh-card-value.warning { color: #d97706; }
    .sh-card-note { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.25rem; }

    /* Lease info */
    .sh-lease { background: var(--bg-card, #fff); border: 1px solid var(--border); border-radius: var(--radius, 8px); padding: 1.25rem; margin-bottom: 2rem; }
    .sh-lease h2 { font-size: 1rem; font-weight: 700; margin: 0 0 0.75rem; }
    .sh-lease-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 2rem; font-size: 0.85rem; }
    .sh-lease-row { display: flex; justify-content: space-between; padding: 0.35rem 0; border-bottom: 1px solid var(--border); }
    .sh-lease-row:last-child { border-bottom: none; }
    .sh-lease-label { color: var(--text-muted); }
    .sh-lease-val { font-weight: 600; color: var(--text); }
    .sh-status-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
    .sh-status-badge.active { background: #dcfce7; color: #16a34a; }
    .sh-status-badge.ended { background: #fee2e2; color: #dc2626; }

    /* Month breakdown table */
    .sh-months { background: var(--bg-card, #fff); border: 1px solid var(--border); border-radius: var(--radius, 8px); padding: 1.25rem; margin-bottom: 2rem; }
    .sh-months h2 { font-size: 1rem; font-weight: 700; margin: 0 0 0.75rem; }
    .sh-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .sh-table th { text-align: left; padding: 0.5rem 0.75rem; font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid var(--border); white-space: nowrap; }
    .sh-table td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .sh-table tbody tr:hover { background: var(--bg, #f6f5f0); }
    .sh-table .amt { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    .sh-table .amt.paid { color: #16a34a; }
    .sh-table .amt.owed { color: #dc2626; }
    .sh-table .amt.zero { color: var(--text-muted); }
    .sh-table th.right { text-align: right; }
    .sh-badge-paid { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 999px; font-size: 0.65rem; font-weight: 600; background: #dcfce7; color: #16a34a; }
    .sh-badge-unpaid { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 999px; font-size: 0.65rem; font-weight: 600; background: #fee2e2; color: #dc2626; }
    .sh-badge-partial { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 999px; font-size: 0.65rem; font-weight: 600; background: #fef3c7; color: #d97706; }
    .sh-badge-future { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 999px; font-size: 0.65rem; font-weight: 600; background: var(--bg, #f6f5f0); color: var(--text-muted); }

    /* Transactions */
    .sh-tx { background: var(--bg-card, #fff); border: 1px solid var(--border); border-radius: var(--radius, 8px); padding: 1.25rem; margin-bottom: 2rem; }
    .sh-tx h2 { font-size: 1rem; font-weight: 700; margin: 0 0 0.75rem; }
    .sh-empty { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; }

    /* Footer */
    .sh-footer { text-align: center; font-size: 0.72rem; color: var(--text-muted); padding: 1rem 0; }

    @media (max-width: 600px) {
      .sh-lease-grid { grid-template-columns: 1fr; }
      .sh-summary { grid-template-columns: 1fr 1fr; }
      .sh-table { font-size: 0.78rem; }
      .sh-table th, .sh-table td { padding: 0.4rem 0.5rem; }
    }
  </style>
  <script type="module" src="../../shared/version-info.js"></script>
</head>
