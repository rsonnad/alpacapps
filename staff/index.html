<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff — AlpacAPPs</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../favicon.png">
  <!-- Bare /staff/ entry point. Role-aware redirect so associates/residents
       reaching /staff/ (e.g. login default) land somewhere they can access
       instead of /staff/spaces.html which denies them. -->
  <script>
    var loc = window.location;
    var qs = (loc.search || '') + (loc.hash || '');
    var target = '/staff/spaces.html';
    try {
      var raw = localStorage.getItem('genalpaca-cached-auth');
      if (raw) {
        var role = (JSON.parse(raw) || {}).role;
        if (role === 'public') target = '/rentals/';
        else if (role === 'resident' || role === 'associate') target = '/devices/cameras.html';
      }
    } catch (e) { /* fall through to default */ }
    window.location.replace(target + qs);
  </script>
  <meta http-equiv="refresh" content="0; url=/staff/spaces.html">
</head>
<body>
  <noscript>
    <p>Redirecting to <a href="/staff/spaces.html">/staff/spaces.html</a>…</p>
  </noscript>
</body>
</html>
