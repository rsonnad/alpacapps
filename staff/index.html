<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff — AlpacAPPs</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../favicon.png">
  <!-- Bare /staff/ entry point. Staff+ land on the Staff section of the
       intranet TOC; associates/residents (e.g. login default) are sent
       somewhere they can access instead. -->
  <script>
    var loc = window.location;
    var qs = (loc.search || '') + (loc.hash || '#sec-staff');
    var target = '/intranet/';
    try {
      var raw = localStorage.getItem('genalpaca-cached-auth');
      if (raw) {
        var role = (JSON.parse(raw) || {}).role;
        if (role === 'public') target = '/rentals/';
        else if (role === 'associate') target = '/associates/worktracking.html';
        else if (role === 'resident') target = '/devices/cameras.html';
      }
    } catch (e) { /* fall through to default */ }
    window.location.replace(target + qs);
  </script>
  <meta http-equiv="refresh" content="0; url=/intranet/#sec-staff">
</head>
<body>
  <noscript>
    <p>Redirecting to <a href="/intranet/#sec-staff">the intranet</a>…</p>
  </noscript>
</body>
</html>
