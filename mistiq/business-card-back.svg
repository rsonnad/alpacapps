  </g>
  <text x="584" y="330" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="14" font-weight="600" fill="#2a1f23">Breathwork Meditation</text>
  <text x="584" y="346" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">Guided breathing techniques</text>
  <text x="584" y="358" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">for transformation</text>

  <!-- ===== ROW 2 ===== -->

  <!-- Card backgrounds — Row 2 -->
  <rect x="112.5"  y="454" width="182" height="172" rx="8" fill="#fff" stroke="#e6e2d9" stroke-width="1"/>
  <rect x="302.75" y="454" width="182" height="172" rx="8" fill="#fff" stroke="#e6e2d9" stroke-width="1"/>
  <rect x="493"    y="454" width="182" height="172" rx="8" fill="#fff" stroke="#e6e2d9" stroke-width="1"/>

  <!-- 4. Assisted Yoga -->
  <g clip-path="url(#g4)">
    <image href="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/mistiq-assets/Thai_Yoga_Massage.jpg"
