  </g>
  <text x="393.75" y="330" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="14" font-weight="600" fill="#2a1f23">Greeting &amp; Meditations</text>
  <text x="393.75" y="346" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">Centering practices to</text>
  <text x="393.75" y="358" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">begin your journey</text>

