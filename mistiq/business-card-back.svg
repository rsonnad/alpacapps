  <text x="393.75" y="606" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">Ancient healing techniques</text>
  <text x="393.75" y="618" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">for releasing tension</text>

  <!-- 6. Sauna -->
  <g clip-path="url(#g6)">
    <image href="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/mistiq-assets/Sauna_Sit.jpg"
           x="499" y="445" width="170" height="140" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <text x="584" y="590" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="14" font-weight="600" fill="#2a1f23">Sauna</text>
  <text x="584" y="606" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">Detoxifying heat therapy</text>

  <!-- ===== ROW 3 ===== -->

  <!-- Card backgrounds — Row 3 -->
  <rect x="112.5"  y="714" width="182" height="172" rx="8" fill="#fff" stroke="#e6e2d9" stroke-width="1"/>
  <rect x="302.75" y="714" width="182" height="172" rx="8" fill="#fff" stroke="#e6e2d9" stroke-width="1"/>
  <rect x="493"    y="714" width="182" height="172" rx="8" fill="#fff" stroke="#e6e2d9" stroke-width="1"/>

  <!-- 7. Cold Plunge -->
  <g clip-path="url(#g7)">
    <image href="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/mistiq-assets/Icebath.jpg"
           x="118.5" y="705" width="170" height="140" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <text x="203.5" y="850" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="14" font-weight="600" fill="#2a1f23">Cold Plunge</text>
  <text x="203.5" y="866" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">Invigorating cold immersion</text>

  <!-- 8. Oil Massage -->
  <g clip-path="url(#g8)">
    <image href="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/mistiq-assets/oil_massage.jpg"
