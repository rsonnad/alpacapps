  </g>
  <text x="584" y="850" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="14" font-weight="600" fill="#2a1f23">Resting &amp; Integration</text>
  <text x="584" y="866" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">Peaceful completion</text>
  <text x="584" y="878" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">of your journey</text>

  <!-- Bottom brand -->
  <line x1="343.75" y1="940" x2="443.75" y2="940" stroke="#c4a77d" stroke-width="0.5"/>
  <text x="393.75" y="980" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="22" font-weight="600" fill="#8b7355" letter-spacing="1">Mistique Journey</text>
  <text x="393.75" y="1006" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="11" fill="#7d6f74">alpacaplayhouse.com/mistiq</text>

  <!-- ==================== TRIM MARKS ==================== -->
  <line x1="37.5"  y1="0"     x2="37.5"  y2="15"    stroke="#000" stroke-width="0.5"/>
  <line x1="0"     y1="18.75" x2="15"    y2="18.75" stroke="#000" stroke-width="0.5"/>
  <line x1="750"   y1="0"     x2="750"   y2="15"    stroke="#000" stroke-width="0.5"/>
  <line x1="772.5" y1="18.75" x2="787.5" y2="18.75" stroke="#000" stroke-width="0.5"/>
  <line x1="37.5"  y1="1222.5" x2="37.5"  y2="1237.5" stroke="#000" stroke-width="0.5"/>
  <line x1="0"     y1="1218.75" x2="15"   y2="1218.75" stroke="#000" stroke-width="0.5"/>
  <line x1="750"   y1="1222.5" x2="750"   y2="1237.5" stroke="#000" stroke-width="0.5"/>
  <line x1="772.5" y1="1218.75" x2="787.5" y2="1218.75" stroke="#000" stroke-width="0.5"/>
</svg>
