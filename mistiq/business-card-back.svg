<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="787.5" height="1237.5" viewBox="0 0 787.5 1237.5">
  <!--
    GotPrint Print-Ready Business Card — BACK (Vertical)
    Final trim size:  2.5" x 4"    = 750 x 1200 px  @ 300 DPI
    Bleed size:       2.625" x 4.125" = 787.5 x 1237.5 px @ 300 DPI
    Bleed zone:       0.125" = 37.5 px on each side
    Safe zone:        ~0.25" = ~75 px from trim edge (~112.5 px from bleed edge)
    Grid:             3 cols x 3 rows, 170px images, 182px card bgs, 8.25px gaps
    Columns (card bg): 112.5, 302.75, 493  |  Images: 118.5, 308.75, 499
    Text centers:      203.5, 393.75, 584
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=Lato:wght@300;400;700&amp;display=swap');
    </style>
    <!-- 9 image clips: 3x3 grid — 170px wide, 110px tall -->
    <clipPath id="g1"><rect x="118.5"  y="200" width="170" height="110" rx="6"/></clipPath>
    <clipPath id="g2"><rect x="308.75" y="200" width="170" height="110" rx="6"/></clipPath>
    <clipPath id="g3"><rect x="499"    y="200" width="170" height="110" rx="6"/></clipPath>
    <clipPath id="g4"><rect x="118.5"  y="460" width="170" height="110" rx="6"/></clipPath>
    <clipPath id="g5"><rect x="308.75" y="460" width="170" height="110" rx="6"/></clipPath>
    <clipPath id="g6"><rect x="499"    y="460" width="170" height="110" rx="6"/></clipPath>
    <clipPath id="g7"><rect x="118.5"  y="720" width="170" height="110" rx="6"/></clipPath>
    <clipPath id="g8"><rect x="308.75" y="720" width="170" height="110" rx="6"/></clipPath>
    <clipPath id="g9"><rect x="499"    y="720" width="170" height="110" rx="6"/></clipPath>
  </defs>

  <!-- Full bleed background -->
  <rect width="787.5" height="1237.5" fill="#f9f6f1"/>

  <!-- Title -->
  <text x="393.75" y="110" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="32" font-weight="700" fill="#2a1f23">Elements of the Journey</text>

  <!-- Subtitle -->
  <text x="393.75" y="142" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="14" font-weight="300" font-style="italic" fill="#7d6f74">a thermal breath &amp; body experience</text>

  <!-- Divider -->
  <line x1="363.75" y1="164" x2="423.75" y2="164" stroke="#c4a77d" stroke-width="1"/>

  <!-- ===== ROW 1 ===== -->

  <!-- Card backgrounds — Row 1 -->
  <rect x="112.5"  y="194" width="182" height="172" rx="8" fill="#fff" stroke="#e6e2d9" stroke-width="1"/>
  <rect x="302.75" y="194" width="182" height="172" rx="8" fill="#fff" stroke="#e6e2d9" stroke-width="1"/>
  <rect x="493"    y="194" width="182" height="172" rx="8" fill="#fff" stroke="#e6e2d9" stroke-width="1"/>

  <!-- 1. Online Intake Survey -->
  <g clip-path="url(#g1)">
    <image href="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/mistiq-assets/Survey.jpg"
           x="118.5" y="185" width="170" height="140" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <text x="203.5" y="330" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif"
        font-size="14" font-weight="600" fill="#2a1f23">Online Intake Survey</text>
  <text x="203.5" y="346" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">Personalized preparation</text>
  <text x="203.5" y="358" text-anchor="middle" font-family="'Lato', sans-serif"
        font-size="9" fill="#7d6f74">for your journey</text>

