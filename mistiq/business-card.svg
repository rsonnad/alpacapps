  <g clip-path="url(#heroClip)">
    <image href="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/mistiq-assets/windingdown.jpg"
           x="0" y="-100" width="787.5" height="637.5" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Gradient fade (full bleed width) -->
  <rect x="0" y="318.75" width="787.5" height="118.75" fill="url(#fadeToCard)"/>

