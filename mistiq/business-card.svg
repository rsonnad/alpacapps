<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="787.5" height="1237.5" viewBox="0 0 787.5 1237.5">
  <!--
    GotPrint Print-Ready Business Card — FRONT (Vertical)
    Final trim size:  2.5" x 4"    = 750 x 1200 px  @ 300 DPI
    Bleed size:       2.625" x 4.125" = 787.5 x 1237.5 px @ 300 DPI
    Bleed zone:       0.125" = 37.5 px on each side
    Safe zone:        ~0.25" = ~75 px from trim edge

    Trim box origin: (37.5, 18.75)
  -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=Lato:wght@300;400;700&amp;display=swap');
    </style>
    <linearGradient id="fadeToCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f6f1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f9f6f1" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="heroClip">
      <rect x="0" y="0" width="787.5" height="437.5"/>
    </clipPath>
    <clipPath id="img1clip"><rect x="97.5"  y="580" width="118" height="88" rx="4"/></clipPath>
    <clipPath id="img2clip"><rect x="225.5" y="580" width="118" height="88" rx="4"/></clipPath>
    <clipPath id="img3clip"><rect x="353.5" y="580" width="118" height="88" rx="4"/></clipPath>
    <clipPath id="img4clip"><rect x="481.5" y="580" width="118" height="88" rx="4"/></clipPath>
    <clipPath id="img5clip"><rect x="609.5" y="580" width="118" height="88" rx="4"/></clipPath>
