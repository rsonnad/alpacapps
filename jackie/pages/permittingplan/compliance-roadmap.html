<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commercial Permit Compliance Roadmap — 160 Still Forest Dr</title>
<link rel="icon" type="image/png" href="../../../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f6f5f0; --card: #fff; --border: #e5e0d8;
    --text: #1c1618; --muted: #8c8279; --accent: #0d9488;
  }
  * { box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.6; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .backlink { display: inline-block; font-size: 0.85rem; color: var(--muted); text-decoration: none; margin-bottom: 1rem; }
  .backlink:hover { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 2rem 2.25rem; }
  h1 { font-size: 1.75rem; margin: 0 0 0.5rem; line-height: 1.25; }
  h2 { font-size: 1.3rem; margin: 2rem 0 0.75rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  h3 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; }
  h4 { font-size: 0.95rem; margin: 1.25rem 0 0.5rem; color: var(--muted); }
  p, li { font-size: 0.92rem; }
  ul, ol { padding-left: 1.25rem; }
  li { margin-bottom: 0.35rem; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: #faf8f3; font-weight: 600; }
  code { background: #f0ede5; padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.85em; }
  strong { color: var(--text); }
  blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; color: var(--muted); margin: 1rem 0; }
  a { color: var(--accent); }
  #content { opacity: 0; transition: opacity 0.2s; }
  #content.loaded { opacity: 1; }
  .loading { text-align: center; color: var(--muted); padding: 3rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="../../../spaces/admin/permittingplan.html">← Permit Task Tracker</a>
  <div class="card">
    <div id="loading" class="loading">Loading roadmap…</div>
    <div id="content"></div>
  </div>
</div>
<script>
fetch('compliance-roadmap.md')
  .then(r => r.ok ? r.text() : Promise.reject(r.status))
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').classList.add('loaded');
  })
  .catch(err => {
    document.getElementById('loading').textContent = 'Failed to load roadmap (' + err + ')';
  });
</script>
</body>
</html>
