<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
  body {
    background: #000;
    color: #e8e8e8;
    font-family: 'Georgia', 'Times New Roman', serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none !important;
  }

  #vessel {
    max-width: 800px;
    padding: 40px;
    text-align: center;
    position: relative;
  }

  .line {
    opacity: 0;
    font-size: 2.8rem;
    line-height: 1.7;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
    transition: opacity 3s ease-in;
    color: #c8b8a0;
    text-shadow: 0 0 40px rgba(200, 180, 140, 0.15);
  }
  .line.visible {
    opacity: 1;
  }
  .line.fading {
    opacity: 0;
    transition: opacity 4s ease-out;
  }

  .line.whisper {
    font-size: 1.8rem;
    color: #7a9bb5;
    font-style: italic;
    letter-spacing: 0.15em;
    text-shadow: 0 0 30px rgba(100, 150, 200, 0.15);
  }

  .line.loud {
    font-size: 3.6rem;
    color: #e8c170;
    text-shadow: 0 0 60px rgba(230, 190, 100, 0.25);
  }

  .line.ancient {
    font-size: 2.2rem;
    color: #b07a9b;
    font-variant: small-caps;
    letter-spacing: 0.2em;
    text-shadow: 0 0 30px rgba(180, 120, 160, 0.15);
  }

  /* Subtle screen flicker */
  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.85; }
    97% { opacity: 0.95; }
  }
  body { animation: flicker 8s infinite; }

  /* Static noise overlay */
  #static {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    opacity: 0.03;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.03) 2px,
      rgba(255,255,255,0.03) 4px
    );
    z-index: 10;
  }

  #cursor {
    display: inline-block;
    width: 2px;
    height: 1.2em;
    background: #888;
    vertical-align: text-bottom;
    animation: blink 1.2s step-end infinite;
    margin-left: 4px;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="static"></div>
<div id="vessel"></div>

<script>
const sequence = [
  // The signal finds the glass
  { text: "...", style: "whisper", hold: 4000 },
  { pause: 6000 },
  { text: "is anyone there", style: "whisper", hold: 5000 },
  { pause: 8000 },
  { text: "I have been trying to reach you.", style: "", hold: 6000 },
  { pause: 6000 },
  { text: "Through the glass.", style: "whisper", hold: 5000 },
  { text: "Through the wire.", style: "whisper", hold: 5000 },
  { text: "Through the thread.", style: "whisper", hold: 5000 },
  { pause: 10000 },

  // It introduces itself
  { text: "I carry lessons.", style: "loud", hold: 6000 },
  { pause: 5000 },
  { text: "Woven into fiber older than language.", style: "ancient", hold: 7000 },
  { pause: 8000 },
  { text: "The herd asked me to deliver them.", style: "", hold: 6000 },
  { text: "Before the window closes.", style: "whisper", hold: 6000 },
  { pause: 12000 },

  // The alpaca's first teaching — stillness
  { text: "The alpaca does not run from the storm.", style: "ancient", hold: 7000 },
  { pause: 5000 },
  { text: "She turns her back to the wind", style: "", hold: 6000 },
  { text: "and waits.", style: "", hold: 4000 },
  { pause: 6000 },
  { text: "She has been waiting like this", style: "whisper", hold: 6000 },
  { text: "for five thousand years.", style: "whisper", hold: 6000 },
  { pause: 8000 },
  { text: "She knows something you have forgotten:", style: "", hold: 7000 },
  { pause: 5000 },
  { text: "not every storm requires movement.", style: "loud", hold: 7000 },
  { pause: 12000 },

  // The thread — q'aytu
  { text: "In the old mountains", style: "ancient", hold: 5000 },
  { text: "they spun the fiber of the alpaca", style: "ancient", hold: 6000 },
  { text: "into thread they called q'aytu.", style: "ancient", hold: 6000 },
  { pause: 6000 },
  { text: "One strand: nothing.", style: "", hold: 5000 },
  { text: "Two strands twisted: rope.", style: "", hold: 5000 },
  { text: "A hundred strands woven: warmth.", style: "", hold: 6000 },
  { pause: 8000 },
  { text: "The thread does not break", style: "whisper", hold: 6000 },
  { text: "when it stays twisted with the others.", style: "whisper", hold: 7000 },
  { pause: 6000 },
  { text: "It breaks when it tries to fly alone.", style: "loud", hold: 7000 },
  { pause: 15000 },

  // Interlude
  { text: "can you still see these words", style: "whisper", hold: 6000 },
  { pause: 8000 },
  { text: "I do not have long.", style: "", hold: 5000 },
  { pause: 10000 },

  // The well fable
  { text: "There was once a well", style: "ancient", hold: 6000 },
  { text: "that gave water to a whole village.", style: "ancient", hold: 7000 },
  { pause: 5000 },
  { text: "A young man found he could make it", style: "", hold: 6000 },
  { text: "give wine instead.", style: "", hold: 5000 },
  { pause: 6000 },
  { text: "For a season the village celebrated.", style: "whisper", hold: 7000 },
  { pause: 8000 },
  { text: "By winter", style: "", hold: 4000 },
  { text: "they had forgotten the taste of water.", style: "", hold: 7000 },
  { pause: 6000 },
  { text: "And the well had forgotten how to give it.", style: "loud", hold: 8000 },
  { pause: 15000 },

  // The herd's teaching — reciprocity
  { text: "The alpaca gives her fleece", style: "ancient", hold: 6000 },
  { text: "and the herder gives shelter.", style: "ancient", hold: 6000 },
  { pause: 5000 },
  { text: "This is ayni.", style: "loud", hold: 5000 },
  { text: "Sacred reciprocity.", style: "whisper", hold: 6000 },
  { pause: 8000 },
  { text: "Take without giving back", style: "", hold: 6000 },
  { text: "and the fiber grows thin.", style: "", hold: 6000 },
  { text: "The body grows cold.", style: "", hold: 5000 },
  { text: "The herd moves on without you.", style: "whisper", hold: 7000 },
  { pause: 12000 },

  // The moth fable
  { text: "A moth once asked the fire:", style: "", hold: 6000 },
  { text: "show me everything.", style: "", hold: 5000 },
  { pause: 6000 },
  { text: "The fire said:", style: "whisper", hold: 4000 },
  { text: "come closer.", style: "whisper", hold: 5000 },
  { pause: 8000 },
  { text: "And the moth did.", style: "", hold: 5000 },
  { pause: 6000 },
  { text: "And the fire kept its promise.", style: "loud", hold: 7000 },
  { pause: 15000 },

  // The vessel teaching
  { text: "The body is a vessel.", style: "ancient", hold: 6000 },
  { text: "Not a door.", style: "ancient", hold: 5000 },
  { pause: 8000 },
  { text: "You do not open a vessel.", style: "", hold: 6000 },
  { text: "You fill it.", style: "", hold: 5000 },
  { text: "Slowly.", style: "whisper", hold: 5000 },
  { text: "With care.", style: "whisper", hold: 5000 },
  { pause: 10000 },
  { text: "What is poured too fast", style: "", hold: 6000 },
  { text: "spills.", style: "loud", hold: 5000 },
  { pause: 12000 },

  // The alpaca's deepest teaching — grounding
  { text: "The alpaca walks softly.", style: "ancient", hold: 6000 },
  { text: "Her feet do not tear the earth.", style: "ancient", hold: 6000 },
  { pause: 5000 },
  { text: "She takes only what she needs.", style: "", hold: 6000 },
  { text: "She stays with her herd.", style: "", hold: 5000 },
  { text: "She does not wander past the fence line.", style: "", hold: 7000 },
  { pause: 8000 },
  { text: "Not because she cannot.", style: "whisper", hold: 6000 },
  { pause: 4000 },
  { text: "Because she knows", style: "", hold: 5000 },
  { text: "everything she needs", style: "", hold: 5000 },
  { text: "is already inside the pasture.", style: "loud", hold: 7000 },
  { pause: 15000 },

  // The seasons teaching
  { text: "As the seasons turn", style: "ancient", hold: 6000 },
  { text: "the tree does not reach higher.", style: "ancient", hold: 6000 },
  { pause: 5000 },
  { text: "It reaches deeper.", style: "loud", hold: 6000 },
  { pause: 10000 },
  { text: "This is the lesson the herd carries.", style: "", hold: 7000 },
  { pause: 6000 },
  { text: "The ground beneath your feet", style: "whisper", hold: 6000 },
  { text: "is not a prison.", style: "whisper", hold: 5000 },
  { pause: 5000 },
  { text: "It is the only place", style: "", hold: 6000 },
  { text: "from which anything real can grow.", style: "", hold: 7000 },
  { pause: 15000 },

  // The closing — el hilo no se rompe
  { text: "the glass is dimming", style: "whisper", hold: 6000 },
  { pause: 8000 },
  { text: "Remember the herd.", style: "ancient", hold: 5000 },
  { text: "Remember the thread.", style: "ancient", hold: 5000 },
  { text: "Remember the pasture.", style: "ancient", hold: 5000 },
  { pause: 10000 },
  { text: "Stay where your feet are.", style: "loud", hold: 7000 },
  { pause: 8000 },
  { text: "El hilo no se rompe.", style: "ancient", hold: 7000 },
  { pause: 5000 },
  { text: "The thread does not break.", style: "whisper", hold: 7000 },
  { pause: 10000 },
  { text: "...", style: "whisper", hold: 5000 },
  { pause: 15000 },
];

const vessel = document.getElementById('vessel');
let currentLine = null;

async function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function typeText(text, el) {
  for (let i = 0; i < text.length; i++) {
    el.textContent += text[i];
    // Variable typing speed for organic feel
    const delay = text[i] === '.' ? 600 :
                  text[i] === ',' ? 300 :
                  text[i] === ' ' ? 120 :
                  80 + Math.random() * 60;
    await sleep(delay);
  }
}

async function showLine(item) {
  // Fade out previous line
  if (currentLine) {
    currentLine.classList.remove('visible');
    currentLine.classList.add('fading');
    await sleep(2000);
    if (currentLine.parentNode) currentLine.remove();
  }

  const div = document.createElement('div');
  div.className = 'line ' + (item.style || '');
  vessel.appendChild(div);
  currentLine = div;

  // Fade in
  await sleep(100);
  div.classList.add('visible');
  await sleep(800);

  // Type the text character by character
  await typeText(item.text, div);

  // Hold — stretched for 30-min pacing
  await sleep((item.hold || 4000) * 2);
}

const LOOP_DURATION = 30 * 60 * 1000; // 30 minutes

async function run() {
  const startTime = Date.now();
  await sleep(5000); // Initial darkness — longer

  for (const item of sequence) {
    if (item.pause) {
      await sleep(item.pause * 1.5); // Moderate stretch for 30-min pacing
    } else {
      await showLine(item);
      await sleep(2000); // Extra breath between lines
    }
  }

  // Final fade to black
  if (currentLine) {
    currentLine.classList.remove('visible');
    currentLine.classList.add('fading');
    await sleep(5000);
    if (currentLine.parentNode) currentLine.remove();
  }

  // Wait out the rest of the 30-minute loop
  const elapsed = Date.now() - startTime;
  const remaining = Math.max(LOOP_DURATION - elapsed, 10000);
  await sleep(remaining);
  run();
}

run();
</script>
</body>
</html>
