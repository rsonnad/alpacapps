<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garage Mahal — Gallery</title>
  <link rel="icon" type="image/png" href="../../favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
      background: #0a0809;
      color: #f5f4ed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }

    .slideshow {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .slideshow-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slideshow-img.active {
      opacity: 1;
    }

    .slideshow-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 28px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      font-size: 16px;
      color: rgba(255,255,255,0.75);
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slideshow-caption.active {
      opacity: 1;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6e6467;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="slideshow">
    <div class="loading" id="slideshowLoading">Loading images...</div>
    <img class="slideshow-img" id="slideA" src="" alt="">
    <img class="slideshow-img" id="slideB" src="" alt="">
    <div class="slideshow-caption" id="captionA"></div>
    <div class="slideshow-caption" id="captionB"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://aphrrfprbixmhissnjfn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwaHJyZnByYml4bWhpc3NuamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5MzA0MjUsImV4cCI6MjA4NTUwNjQyNX0.yYkdQIq97GQgxK7yT2OQEPi5Tt-a7gM45aF8xjSD6wk';
    const SLIDE_INTERVAL = 12000;
    const RELOAD_INTERVAL = 3600000;

    let photos = [];
    let photoIndex = 0;
    let activeSlot = 'A';

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function cleanCaption(raw) {
      if (!raw) return '';
      return raw
        .replace(/^AI-generated:\s*/i, '')
        .replace(/^Generate\s+/i, '')
        .substring(0, 120);
    }

    async function loadPhotos() {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/media?category=eq.mktg&is_archived=eq.false&select=url,caption&limit=200`,
          { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.length > 0) {
          photos = shuffle(data);
          photoIndex = 0;
          document.getElementById('slideshowLoading').style.display = 'none';
        }
      } catch (err) {
        console.error('Failed to load photos:', err);
        document.getElementById('slideshowLoading').textContent = 'Could not load images';
      }
    }

    function showNextSlide() {
      if (photos.length === 0) return;

      const photo = photos[photoIndex];
      photoIndex = (photoIndex + 1) % photos.length;
      if (photoIndex === 0) shuffle(photos);

      const nextSlot = activeSlot === 'A' ? 'B' : 'A';
      const prevSlot = activeSlot;

      const nextImg = document.getElementById(`slide${nextSlot}`);
      const nextCap = document.getElementById(`caption${nextSlot}`);
      const prevImg = document.getElementById(`slide${prevSlot}`);
      const prevCap = document.getElementById(`caption${prevSlot}`);

      const preload = new Image();
      preload.onload = () => {
        nextImg.src = photo.url;
        nextCap.textContent = cleanCaption(photo.caption);
        nextImg.classList.add('active');
        nextCap.classList.add('active');
        prevImg.classList.remove('active');
        prevCap.classList.remove('active');
        activeSlot = nextSlot;
      };
      preload.src = photo.url;
    }

    async function init() {
      await loadPhotos();
      if (photos.length > 0) {
        showNextSlide();
        setInterval(showNextSlide, SLIDE_INTERVAL);
      }
      setInterval(loadPhotos, RELOAD_INTERVAL);
    }

    init();
  </script>
</body>
</html>
