<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot feedback inbox</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #2b2724; --muted: #6b625c; --line: #ddd5cc;
    --accent: #2f6b4f; --accent-text: #ffffff; --error: #a3341f;
    --new: #2f5f9e; --read: #8a6d1f; --done: #2f6b4f; --chip: #efe9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1917; --card: #24211f; --text: #ece7e2; --muted: #a8a09a; --line: #3a3532;
      --accent: #6fbf95; --accent-text: #10241a; --error: #f08a74;
      --new: #8db4ec; --read: #e0c26e; --done: #6fbf95; --chip: #2f2b28;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 60rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
  header { display: flex; flex-wrap: wrap; gap: .75rem; align-items: baseline; justify-content: space-between; margin-bottom: 1.25rem; }
  h1 { font-size: 1.5rem; margin: 0; }
  .who { color: var(--muted); font-size: .875rem; }
  .who button { font: inherit; background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: 1rem; }
  select, .btn { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .45rem .7rem; }
  .btn { cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .summary { color: var(--muted); margin-left: auto; font-size: .875rem; }
  .list { display: grid; gap: .75rem; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; }
  .meta { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; font-size: .8125rem; color: var(--muted); margin-bottom: .5rem; }
  .chip { background: var(--chip); border-radius: 999px; padding: .1rem .55rem; color: var(--text); }
  .status { font-weight: 600; }
  .status.new { color: var(--new); } .status.read { color: var(--read); } .status.done { color: var(--done); }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 .75rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .actions .btn { padding: .3rem .7rem; font-size: .875rem; }
  .email { font-size: .875rem; overflow-wrap: anywhere; }
  .notice { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1.5rem; text-align: center; }
  .notice p { margin: 0 0 1rem; } .notice p:last-child { margin: 0; }
  .error { color: var(--error); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Bot feedback</h1>
    <span class="who" id="who" hidden></span>
  </header>

  <div class="notice" id="state"><p>Loading…</p></div>

  <section id="app" hidden>
    <div class="bar">
      <select id="filterType" aria-label="Filter by type">
        <option value="">All types</option>
        <option value="feedback">Feedback</option>
        <option value="feature_request">Feature requests</option>
        <option value="bug">Bugs</option>
      </select>
      <select id="filterStatus" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="read">Read</option>
        <option value="done">Done</option>
      </select>
      <button class="btn" id="refresh" type="button">Refresh</button>
      <button class="btn primary" id="csv" type="button">Download CSV</button>
      <span class="summary" id="summary"></span>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>

<script src="/vendor/supabase-js-2.39.3.min.js"></script>
<script type="module">
  import { supabase } from '/shared/supabase.js';

  const TYPE_LABEL = { feedback: 'Feedback', feature_request: 'Feature request', bug: 'Bug' };
  const state = document.getElementById('state');
  const app = document.getElementById('app');
  const list = document.getElementById('list');
  const summary = document.getElementById('summary');
  const filterType = document.getElementById('filterType');
  const filterStatus = document.getElementById('filterStatus');
  let rows = [];

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const when = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

  function showNotice(html) { app.hidden = true; state.hidden = false; state.innerHTML = html; }

  async function start() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      location.href = '/login/?redirect=' + encodeURIComponent(location.pathname);
      return;
    }
    const who = document.getElementById('who');
    who.hidden = false;
    who.innerHTML = `Signed in as ${esc(session.user.email)} · <button type="button" id="signout">Sign out</button>`;
    document.getElementById('signout').addEventListener('click', async () => { await supabase.auth.signOut(); location.reload(); });

    const { data: allowed, error } = await supabase.rpc('bot_feedback_is_viewer');
    if (error) { showNotice(`<p class="error">Could not check access: ${esc(error.message)}</p>`); return; }
    if (!allowed) {
      showNotice('<p>This page is only for Rahul, Sonia and Haydn.</p><p>Signed in with a different account? Sign out above and sign in with Google using your own address.</p>');
      return;
    }
    await load();
  }

  async function load() {
    const { data, error } = await supabase
      .from('bot_feedback')
      .select('id, created_at, type, message, email, bot_name, bot_version, source, status')
      .order('created_at', { ascending: false })
      .limit(5000);
    if (error) { showNotice(`<p class="error">Could not load feedback: ${esc(error.message)}</p>`); return; }
    rows = data;
    state.hidden = true; app.hidden = false;
    render();
  }

  function filtered() {
    return rows.filter(r => (!filterType.value || r.type === filterType.value) && (!filterStatus.value || r.status === filterStatus.value));
  }

  function render() {
    const shown = filtered();
    const fresh = rows.filter(r => r.status === 'new').length;
    summary.textContent = `${shown.length} shown · ${rows.length} total · ${fresh} new`;
    if (!shown.length) { list.innerHTML = '<div class="notice"><p>Nothing here yet.</p></div>'; return; }
    list.innerHTML = shown.map(r => `
      <article class="item" data-id="${esc(r.id)}">
        <div class="meta">
          <span class="status ${esc(r.status)}">${esc(r.status[0].toUpperCase() + r.status.slice(1))}</span>
          <span class="chip">${esc(TYPE_LABEL[r.type] || r.type)}</span>
          ${r.bot_name ? `<span class="chip">${esc(r.bot_name)}${r.bot_version ? ' ' + esc(r.bot_version) : ''}</span>` : ''}
          <span>${r.source === 'web' ? 'Web form' : 'From a bot'}</span>
          <span>${esc(when(r.created_at))}</span>
        </div>
        <p class="msg">${esc(r.message)}</p>
        <div class="actions">
          ${r.status !== 'read' ? '<button class="btn" data-status="read" type="button">Mark read</button>' : ''}
          ${r.status !== 'done' ? '<button class="btn" data-status="done" type="button">Mark done</button>' : ''}
          ${r.status !== 'new' ? '<button class="btn" data-status="new" type="button">Mark new</button>' : ''}
          ${r.email ? `<a class="email" href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : ''}
        </div>
      </article>`).join('');
  }

  list.addEventListener('click', async (event) => {
    const button = event.target.closest('button[data-status]');
    if (!button) return;
    const id = button.closest('.item').dataset.id;
    const status = button.dataset.status;
    button.disabled = true;
    const { data, error } = await supabase.from('bot_feedback').update({ status }).eq('id', id).select('id, status');
    if (error || !data?.length) {
      button.disabled = false;
      alert(error ? `Could not update: ${error.message}` : 'Could not update this item.');
      return;
    }
    rows.find(r => r.id === id).status = status;
    render();
  });

  function csvCell(value) {
    let s = String(value ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // keep spreadsheets from running it as a formula
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  document.getElementById('csv').addEventListener('click', () => {
    const cols = ['created_at', 'type', 'status', 'message', 'email', 'bot_name', 'bot_version', 'source', 'id'];
    const lines = [cols.join(','), ...filtered().map(r => cols.map(c => csvCell(r[c])).join(','))];
    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `bot-feedback-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  filterType.addEventListener('change', render);
  filterStatus.addEventListener('change', render);
  document.getElementById('refresh').addEventListener('click', load);

  start().catch(err => showNotice(`<p class="error">Something went wrong: ${esc(err.message)}</p>`));
</script>
</body>
</html>
