<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Suite — AlpacApps DevControl</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles/site.css">
    <link rel="stylesheet" href="/styles/tailwind.out.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #faf9f6;
            color: #1c1618;
            min-height: 100vh;
            padding: 2rem 1.5rem 4rem;
        }
        .container { max-width: 860px; margin: 0 auto; }
        .header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.5rem; }
        h1 { font-size: 1.75rem; font-weight: 700; color: #1c1618; }
        .back-link { font-size: 0.85rem; color: #8a7f76; text-decoration: none; }
        .back-link:hover { color: #d4883a; }
        .subtitle { font-size: 0.85rem; color: #8a7f76; margin-bottom: 1.5rem; }

        .summary-row {
            display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap;
        }
        .summary-stat {
            background: #fff; border: 1px solid #e8e4df; border-radius: 8px;
            padding: 0.75rem 1rem; flex: 1; min-width: 100px; text-align: center;
        }
        .summary-value { display: block; font-size: 1.5rem; font-weight: 700; }
        .summary-value.pass { color: #16a34a; }
        .summary-value.fail { color: #dc2626; }
        .summary-value.pending { color: #8a7f76; }
        .summary-label { display: block; font-size: 0.7rem; color: #8a7f76; margin-top: 0.1rem; text-transform: uppercase; letter-spacing: 0.04em; }

        .test-card {
            background: #fff; border: 1px solid #e8e4df; border-radius: 8px;
            margin-bottom: 0.75rem; overflow: hidden;
            transition: border-color 0.15s;
        }
        .test-card:hover { border-color: #d4883a; }
        .test-header {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.85rem 1rem; cursor: pointer; user-select: none;
        }
        .test-header:hover { background: #faf9f6; }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        }
        .status-dot.pass { background: #16a34a; }
        .status-dot.fail { background: #dc2626; }
        .status-dot.never { background: #d1d5db; }
        .status-dot.stale { background: #f59e0b; }
        .test-name { font-weight: 600; font-size: 0.95rem; flex: 1; }
        .test-meta { display: flex; gap: 1rem; align-items: center; flex-shrink: 0; }
        .meta-tag {
            font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px;
            background: #f3f1ed; color: #8a7f76; white-space: nowrap;
        }
        .meta-tag.model { background: #ede9fe; color: #6b21a8; }
        .meta-tag.claude-fix { background: #dbeafe; color: #1d4ed8; }

        .test-details {
            display: none; padding: 0 1rem 1rem;
            border-top: 1px solid #f3f1ed;
        }
        .test-card.expanded .test-details { display: block; }
        .detail-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.5rem; margin-top: 0.75rem;
        }
        .detail-item { font-size: 0.8rem; }
        .detail-label { color: #8a7f76; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; }
        .detail-value { font-weight: 500; margin-top: 0.1rem; }
        .detail-value a { color: #d4883a; text-decoration: none; }
        .detail-value a:hover { text-decoration: underline; }

        .result-summary {
            margin-top: 0.75rem; padding: 0.6rem 0.75rem;
            background: #faf9f6; border-radius: 6px; font-size: 0.8rem;
        }
        .result-summary .pass-text { color: #16a34a; font-weight: 600; }
        .result-summary .fail-text { color: #dc2626; font-weight: 600; }

        .section-label {
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.06em; color: #8a7f76; margin: 1.5rem 0 0.5rem;
        }

        .empty-state {
            text-align: center; padding: 3rem 1rem; color: #8a7f76;
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .test-meta { flex-wrap: wrap; gap: 0.4rem; }
            .summary-row { gap: 0.5rem; }
            .summary-stat { min-width: 80px; padding: 0.5rem; }
            .detail-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Test Suite</h1>
            <a href="index.html" class="back-link">← DevControl</a>
        </div>
        <p class="subtitle">All registered tests, their last run results, and status.</p>

        <div class="summary-row" id="summaryRow">
            <div class="summary-stat"><span class="summary-value" id="totalTests">—</span><span class="summary-label">Tests</span></div>
            <div class="summary-stat"><span class="summary-value pass" id="totalPassed">—</span><span class="summary-label">Passed</span></div>
            <div class="summary-stat"><span class="summary-value fail" id="totalFailed">—</span><span class="summary-label">Failed</span></div>
            <div class="summary-stat"><span class="summary-value pending" id="totalNeverRun">—</span><span class="summary-label">Never Run</span></div>
        </div>

        <div class="section-label">AI / LLM Tests</div>
        <div id="aiTests"></div>

        <div class="section-label">Infrastructure Tests</div>
        <div id="infraTests"></div>

        <div class="section-label">Payment & Email Tests</div>
        <div id="paymentTests"></div>
    </div>

    <script>
    // =============================================
    // Test Registry — add new tests here
    // =============================================
    const TESTS = [
      {
        id: 'pai-test-suite',
        name: 'PAI Response Quality',
        section: 'ai',
        description: 'Queries real Supabase data, generates 50+ test questions across 14 categories, calls PAI API endpoint, and scores responses with keyword matching.',
        runner: 'dev/testing/pai-test-suite.js',
        reportUrl: '/dev/testing/testrun1.html',
        resultsFile: '/dev/testing/results.json',
        models: ['Gemini 2.5 Flash'],
        lastRun: null,     // populated from results.json
        duration: null,
        passRate: null,
        totalQueries: null,
        passed: null,
        failed: null,
        avgScore: null,
        avgResponseTime: null,
        sentToClaude: false,
      },
      {
        id: 'site-health',
        name: 'Site Health Check',
        section: 'infra',
        description: 'Loads 40+ pages (public, resident, admin), checks camera feeds, verifies device inventory, and tests Supabase connectivity.',
        runner: 'spaces/admin/devcontrol/devdocs/tests/site-health.js',
        reportUrl: null,
        resultsFile: null,
        models: [],
        lastRun: null,
        duration: null,
        passRate: null,
        totalQueries: null,
        passed: null,
        failed: null,
        sentToClaude: false,
      },
      {
        id: 'payment-email-parsing',
        name: 'Payment Email Parsing',
        section: 'payment',
        description: 'Tests Zelle, PayPal, and Coinbase email parsers with sample notification emails. Verifies sender name, amount, and transaction ID extraction.',
        runner: null,
        reportUrl: null,
        resultsFile: null,
        models: [],
        lastRun: null,
        duration: null,
        passRate: null,
        totalQueries: null,
        passed: null,
        failed: null,
        sentToClaude: false,
        status: 'not-implemented',
      },
      {
        id: 'email-classifier',
        name: 'Email Classifier Accuracy',
        section: 'ai',
        description: 'Tests the dual-model email classifier (Gemini Flash + Llama Maverick) with sample emails across categories: spam, payment, receipt, query, complaint.',
        runner: null,
        reportUrl: null,
        resultsFile: null,
        models: ['Gemini 2.5 Flash', 'Llama 4 Maverick'],
        lastRun: null,
        duration: null,
        passRate: null,
        totalQueries: null,
        passed: null,
        failed: null,
        sentToClaude: false,
        status: 'not-implemented',
      },
      {
        id: 'tenant-matcher',
        name: 'Tenant Matcher Accuracy',
        section: 'payment',
        description: 'Tests the 3-tier payment sender matching (cached → exact → Gemini AI) with various name formats, misspellings, and amount-based matching.',
        runner: null,
        reportUrl: null,
        resultsFile: null,
        models: ['Gemini 2.0 Flash'],
        lastRun: null,
        duration: null,
        passRate: null,
        totalQueries: null,
        passed: null,
        failed: null,
        sentToClaude: false,
        status: 'not-implemented',
      },
    ];

    // =============================================
    // Load results from JSON files
    // =============================================
    async function loadResults() {
      for (const test of TESTS) {
        if (!test.resultsFile) continue;
        try {
          const resp = await fetch(test.resultsFile + '?t=' + Date.now());
          if (!resp.ok) continue;
          const data = await resp.json();
          if (data.summary) {
            test.lastRun = data.summary.runStart;
            test.duration = data.summary.durationFormatted || formatDuration(data.summary.durationMs);
            test.passRate = data.summary.passRate;
            test.totalQueries = data.summary.totalQueries;
            test.passed = data.summary.passed;
            test.failed = data.summary.failed;
            test.avgScore = data.summary.avgScore;
            test.avgResponseTime = data.summary.avgResponseTimeMs
              ? Math.round(data.summary.avgResponseTimeMs) + 'ms'
              : null;
          }
        } catch (e) {
          console.warn(`Failed to load results for ${test.id}:`, e);
        }
      }
    }

    function formatDuration(ms) {
      if (!ms) return '—';
      if (ms < 1000) return ms + 'ms';
      if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
      const m = Math.floor(ms / 60000);
      const s = Math.round((ms % 60000) / 1000);
      return m + 'm ' + s + 's';
    }

    function formatDate(iso) {
      if (!iso) return 'Never';
      const d = new Date(iso);
      const now = new Date();
      const diffDays = Math.floor((now - d) / 86400000);
      const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      let ago = '';
      if (diffDays === 0) ago = ' (today)';
      else if (diffDays === 1) ago = ' (yesterday)';
      else if (diffDays < 30) ago = ` (${diffDays}d ago)`;
      else ago = ` (${Math.floor(diffDays / 30)}mo ago)`;
      return dateStr + ' ' + timeStr + ago;
    }

    function getStatus(test) {
      if (test.status === 'not-implemented') return 'never';
      if (!test.lastRun) return 'never';
      const daysSince = Math.floor((Date.now() - new Date(test.lastRun)) / 86400000);
      if (daysSince > 14) return 'stale';
      if (test.failed > 0) return 'fail';
      return 'pass';
    }

    // =============================================
    // Render
    // =============================================
    function render() {
      const sections = { ai: 'aiTests', infra: 'infraTests', payment: 'paymentTests' };
      let totalPassed = 0, totalFailed = 0, totalNever = 0, total = 0;

      for (const [sectionKey, containerId] of Object.entries(sections)) {
        const container = document.getElementById(containerId);
        const sectionTests = TESTS.filter(t => t.section === sectionKey);
        container.innerHTML = '';

        if (sectionTests.length === 0) {
          container.innerHTML = '<div class="empty-state">No tests registered</div>';
          continue;
        }

        for (const test of sectionTests) {
          total++;
          const status = getStatus(test);
          if (status === 'never') totalNever++;
          else if (status === 'fail') totalFailed++;
          else totalPassed++;

          const card = document.createElement('div');
          card.className = 'test-card';
          card.innerHTML = `
            <div class="test-header" onclick="this.parentElement.classList.toggle('expanded')">
              <div class="status-dot ${status}" title="${status}"></div>
              <span class="test-name">${test.name}</span>
              <div class="test-meta">
                ${test.models.length ? test.models.map(m => `<span class="meta-tag model">${m}</span>`).join('') : ''}
                ${test.sentToClaude ? '<span class="meta-tag claude-fix">Sent to Claude</span>' : ''}
                ${test.status === 'not-implemented' ? '<span class="meta-tag">Not implemented</span>' : ''}
                ${test.lastRun ? `<span class="meta-tag">${formatDuration(test.duration)}</span>` : ''}
              </div>
            </div>
            <div class="test-details">
              <p style="font-size:0.8rem;color:#8a7f76;margin-bottom:0.5rem;">${test.description}</p>
              <div class="detail-grid">
                <div class="detail-item">
                  <div class="detail-label">Last Run</div>
                  <div class="detail-value">${formatDate(test.lastRun)}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Duration</div>
                  <div class="detail-value">${test.duration || '—'}</div>
                </div>
                <div class="detail-item">
                  <div class="detail-label">Runner</div>
                  <div class="detail-value">${test.runner ? `<code style="font-size:0.75rem">${test.runner}</code>` : '<em>Not implemented</em>'}</div>
                </div>
                ${test.reportUrl ? `
                <div class="detail-item">
                  <div class="detail-label">Report</div>
                  <div class="detail-value"><a href="${test.reportUrl}" target="_blank">View report →</a></div>
                </div>` : ''}
              </div>
              ${test.lastRun ? `
              <div class="result-summary">
                <span class="pass-text">${test.passed || 0} passed</span> ·
                <span class="fail-text">${test.failed || 0} failed</span>
                ${test.totalQueries ? ` · ${test.totalQueries} total` : ''}
                ${test.passRate ? ` · ${test.passRate} pass rate` : ''}
                ${test.avgScore ? ` · avg score ${test.avgScore}` : ''}
                ${test.avgResponseTime ? ` · avg ${test.avgResponseTime}` : ''}
                ${test.sentToClaude ? ' · <span style="color:#1d4ed8;font-weight:600">Failures sent to headless Claude for fix</span>' : ''}
              </div>` : ''}
            </div>
          `;
          container.appendChild(card);
        }
      }

      document.getElementById('totalTests').textContent = total;
      document.getElementById('totalPassed').textContent = totalPassed;
      document.getElementById('totalFailed').textContent = totalFailed;
      document.getElementById('totalNeverRun').textContent = totalNever;
    }

    // =============================================
    // Init
    // =============================================
    (async () => {
      await loadResults();
      render();
    })();
    </script>
</body>
</html>
