<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Test Dev - AlpacAPPs Admin</title>
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <script>try{var c=localStorage.getItem("genalpaca-cached-auth");if(c&&JSON.parse(c).appUser)document.documentElement.dataset.cachedAuth="1"}catch(e){}</script>
  <style>.hidden{display:none!important}[data-cached-auth] #loadingOverlay{display:none!important}[data-cached-auth] #appContent.hidden{display:block!important}#loadingOverlay{position:fixed;inset:0;background:#f6f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}.loading-overlay__logo{display:flex;align-items:center;gap:.75rem}.loading-overlay__icon{height:40px;width:auto;max-width:none}.loading-overlay__wordmark{height:28px;width:auto;max-width:none}</style>
  <link rel="stylesheet" href="../styles.css?v=5">
  <link rel="stylesheet" href="styles.css?v=5">
  <link rel="stylesheet" href="manage-shared.css?v=5">
  <link rel="stylesheet" href="../../styles/site.css">
  <link rel="stylesheet" href="../../styles/tailwind.out.css">
  <link rel="stylesheet" href="testdev.css?v=1">
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-overlay__logo">
      <img src="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/housephotos/logos/alpaca-head-black-transparent.png" alt="" class="loading-overlay__icon" width="28" height="40">
      <img src="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/housephotos/logos/wordmark-black-transparent.png" alt="Alpaca Playhouse" class="loading-overlay__wordmark" width="28" height="28">
    </div>
    <div class="spinner spinner--sm"></div>
  </div>

  <div id="unauthorizedOverlay" class="loading-overlay hidden"></div>

  <div id="appContent" class="hidden">
    <div id="siteHeader"></div>
    <span data-site-version style="display:none">v260225.06 2:02p</span>

    <div class="context-switcher hidden" id="contextSwitcher">
      <a href="/residents/" class="context-switcher-btn">Resident</a>
      <a class="context-switcher-btn active">Staff</a>
    </div>

    <div class="manage-tabs" id="tabNav"></div>

    <main class="manage-content testdev-page">
      <section class="testdev-toolbar">
        <div>
          <h1>GitHub Changes</h1>
          <p>Recent commits to <code>main</code>, filtered by author.</p>
        </div>
        <div class="testdev-toolbar-actions">
          <select id="authorFilter" class="testdev-select">
            <option value="">All authors</option>
          </select>
          <button id="refreshBtn" class="btn-small btn-primary">Refresh</button>
        </div>
      </section>

      <section class="testdev-summary-grid">
        <article class="testdev-summary-card">
          <h2>Total Commits</h2>
          <p id="totalCommits" class="testdev-summary-value">--</p>
          <p id="dateRange" class="testdev-summary-sub">--</p>
        </article>
        <article class="testdev-summary-card">
          <h2>Authors</h2>
          <p id="authorCount" class="testdev-summary-value">--</p>
          <p id="topAuthor" class="testdev-summary-sub">--</p>
        </article>
        <article class="testdev-summary-card">
          <h2>Latest Commit</h2>
          <p id="latestMessage" class="testdev-summary-value">--</p>
          <p id="latestWhen" class="testdev-summary-sub">--</p>
        </article>
      </section>

      <section class="testdev-commits-card">
        <header class="testdev-commits-header">
          <h2>Commit History</h2>
          <p id="commitSubtitle">Newest first</p>
        </header>
        <div id="commitList" class="testdev-commit-list">
          <div class="testdev-empty">Loading commits...</div>
        </div>
        <div class="testdev-load-more hidden" id="loadMoreWrap">
          <button id="loadMoreBtn" class="btn-small">Load More</button>
        </div>
      </section>
    </main>
  </div>

  <script src="../../shared/instant-chrome.js"></script>
  <script type="module" src="../../shared/version-info.js"></script>
  <script src="/vendor/supabase-js-2.39.3.min.js"></script>
  <script type="module" src="testdev.js"></script>
</body>
</html>
