<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Permitting - Alpaca Playhouse Admin</title>
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <script>try{var c=localStorage.getItem("genalpaca-cached-auth");if(c&&JSON.parse(c).appUser)document.documentElement.dataset.cachedAuth="1"}catch(e){}</script>
  <style>.hidden{display:none!important}[data-cached-auth] #loadingOverlay{opacity:0!important;pointer-events:none!important;visibility:hidden!important}[data-cached-auth] #appContent.hidden{display:block!important}#loadingOverlay{position:fixed;inset:0;background:#f6f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .16s ease-out}.loading-overlay__logo{display:flex;align-items:center;gap:.75rem;min-height:40px}.loading-overlay__icon{height:40px;width:auto;max-width:none}.loading-overlay__wordmark{height:28px;width:auto;max-width:none}</style>
  <link rel="stylesheet" href="../styles.css?v=4">
  <link rel="stylesheet" href="styles.css?v=4">
  <link rel="stylesheet" href="manage-shared.css?v=1">
  <link rel="stylesheet" href="../../styles/site.css">
  <link rel="stylesheet" href="../../styles/tailwind.out.css">
  <style>
    .permit-page { max-width: 960px; }

    .permit-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    .permit-stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; text-align: center; }
    .permit-stat .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.04em; }
    .permit-stat .value { font-size: 1.4rem; font-weight: 800; margin-top: 0.15rem; }
    .permit-stat .value.done { color: var(--available); }
    .permit-stat .value.pending { color: var(--accent); }
    .permit-stat .value.blocked { color: var(--occupied); }

    .permit-warning { background: #fef3c7; border: 1px solid #f59e0b; border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 1.5rem; display: flex; gap: 0.5rem; align-items: flex-start; }
    .permit-warning svg { flex-shrink: 0; color: #b45309; margin-top: 0.1rem; }
    .permit-warning .warn-text { font-size: 0.85rem; color: #78350f; }
    .permit-warning .warn-text strong { font-weight: 700; }

    .phase-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.25rem; overflow: hidden; }
    .phase-header { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1rem; background: var(--bg); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
    .phase-header:hover { background: #f0efea; }
    .phase-header h3 { font-size: 0.95rem; font-weight: 700; margin: 0; flex: 1; }
    .phase-progress { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); }
    .phase-chevron { transition: transform 0.2s; }
    .phase-section.collapsed .phase-chevron { transform: rotate(-90deg); }
    .phase-section.collapsed .phase-body { display: none; }

    .task-row { display: grid; grid-template-columns: 28px 1fr 100px 80px; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem; border-bottom: 1px solid #f3f4f6; font-size: 0.85rem; }
    .task-row:last-child { border-bottom: none; }
    .task-row:hover { background: #fafaf8; }

    .task-check { width: 18px; height: 18px; border: 2px solid #d1d5db; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .task-check.done { background: var(--available); border-color: var(--available); }
    .task-check.done svg { display: block; }
    .task-check svg { display: none; color: #fff; width: 12px; height: 12px; }

    .task-info { min-width: 0; }
    .task-name { font-weight: 600; }
    .task-name .task-code { color: var(--text-muted); font-weight: 500; margin-right: 0.3rem; }
    .task-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .task-status { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; padding: 0.15rem 0.5rem; border-radius: 10px; text-align: center; white-space: nowrap; }
    .task-status.completed { background: #d1fae5; color: #065f46; }
    .task-status.pending { background: #e0e7ff; color: #3730a3; }
    .task-status.in_progress { background: #fef3c7; color: #92400e; }
    .task-status.blocked { background: #fee2e2; color: #991b1b; }
    .task-status.skipped { background: #f3f4f6; color: #6b7280; }
    .task-status.not_needed { background: #f3f4f6; color: #9ca3af; }

    .task-assignee { font-size: 0.7rem; color: var(--text-muted); text-align: center; }

    .task-cost { font-size: 0.75rem; color: var(--text-muted); text-align: right; }

    .cost-summary { display: flex; justify-content: flex-end; gap: 1.5rem; padding: 0.75rem 1rem; font-size: 0.85rem; background: #f8f7f4; border-top: 2px solid var(--border); }
    .cost-summary .cost-item { display: flex; gap: 0.3rem; }
    .cost-summary .cost-label { color: var(--text-muted); }
    .cost-summary .cost-value { font-weight: 700; }

    /* Task detail modal */
    .task-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .task-modal { background: #fff; border-radius: 12px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .task-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
    .task-modal-header h3 { font-size: 1rem; margin: 0; }
    .task-modal-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); padding: 0.25rem; }
    .task-modal-body { padding: 1.25rem; }
    .task-modal-body .field { margin-bottom: 1rem; }
    .task-modal-body .field label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.25rem; }
    .task-modal-body select, .task-modal-body input, .task-modal-body textarea { width: 100%; padding: 0.4rem 0.6rem; border: 1px solid #d1d5db; border-radius: var(--radius); font-size: 0.85rem; box-sizing: border-box; font-family: inherit; }
    .task-modal-body textarea { min-height: 60px; resize: vertical; }
    .task-modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 0.75rem 1.25rem; border-top: 1px solid var(--border); }
    .task-modal-footer button { padding: 0.4rem 1rem; border-radius: var(--radius); font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
    .task-modal-footer .btn-cancel { background: #f3f4f6; color: #374151; border-color: #d1d5db; }
    .task-modal-footer .btn-save { background: var(--accent); color: #fff; }

    .doc-links { margin-top: 0.5rem; }
    .doc-links a { display: inline-block; font-size: 0.75rem; color: var(--accent); margin-right: 0.75rem; text-decoration: none; }
    .doc-links a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      .task-row { grid-template-columns: 28px 1fr 80px; }
      .task-assignee { display: none; }
      .permit-summary { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-overlay__logo">
      <img src="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/housephotos/logos/alpaca-head-black-transparent.png" alt="" class="loading-overlay__icon" width="28" height="40" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 21 30%22%3E%3Cpath d=%22M10.5 1.5C8.3 1.5 6.5 3.3 6.5 5.5v4.1L3.8 13c-1 1.3-1.5 2.8-1.5 4.4 0 4.6 3.7 8.3 8.2 8.3s8.2-3.7 8.2-8.3c0-1.6-.5-3.2-1.5-4.4l-2.7-3.4V5.5c0-2.2-1.8-4-4-4z%22 fill=%22%231f1720%22/%3E%3Cellipse cx=%2210.5%22 cy=%2218.6%22 rx=%223.1%22 ry=%224.7%22 fill=%22%23f6f5f0%22/%3E%3C/svg%3E'">
      <img src="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/housephotos/logos/wordmark-black-transparent.png" alt="Alpaca Playhouse" class="loading-overlay__wordmark" width="28" height="28" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 28%22%3E%3Ctext x=%220%22 y=%2220%22 font-size=%2216%22 font-family=%22Arial,sans-serif%22 fill=%22%231f1720%22%3EAlpaca%3C/text%3E%3C/svg%3E'">
    </div>
    <div class="spinner spinner--sm"></div>
  </div>

  <div id="unauthorizedOverlay" class="loading-overlay hidden"></div>

  <div id="appContent" class="hidden">
    <div id="siteHeader"></div>
    <span data-site-version style="display:none">v260306.13 11:44a</span>

    <div class="context-switcher hidden" id="contextSwitcher">
      <a href="/residents/" class="context-switcher-btn">Resident</a>
      <a class="context-switcher-btn active">Staff</a>
    </div>

    <div class="manage-tabs"></div>

    <div class="manage-container permit-page">
      <!-- Warning banner -->
      <div class="permit-warning">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <div class="warn-text">
          <strong>Construction already started.</strong> The bathroom building (1st floor with 2 toilets + shower) is under construction without an approved IDP. Per county rules this is a Class B misdemeanor. Disclose proactively at the pre-development meeting.
        </div>
      </div>

      <!-- Summary stats -->
      <div class="permit-summary" id="summaryStats"></div>

      <!-- Phase sections rendered by JS -->
      <div id="phasesContainer"></div>

      <!-- Cost totals -->
      <div id="costSummary" class="phase-section" style="margin-top:1rem;"></div>
    </div>
  </div>

  <!-- Task detail modal (rendered by JS) -->
  <div id="taskModalContainer"></div>

  <script type="module" src="permitting.js"></script>
</body>
</html>
