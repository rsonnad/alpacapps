<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>AlpacAPPs - Page Not Found</title>
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages SPA routing fallback
    // When a 404 occurs, redirect to the appropriate page if known
    const path = window.location.pathname;

    // Known valid paths - redirect to their index.html
    const validPaths = {
      // Main site pages
      '/alpacapps': '/',
      '/': '/index.html',
      '/visiting': '/visiting/',
      '/visiting/': '/visiting/index.html',
      '/orientation': '/orientation/',
      '/orientation/': '/orientation/index.html',
      '/overnight': '/overnight/',
      '/overnight/': '/overnight/index.html',
      '/worktrade': '/worktrade/',
      '/worktrade/': '/worktrade/index.html',
      '/contact': '/contact/',
      '/contact/': '/contact/index.html',
      // Hidden pages
      '/welcome': '/welcome/',
      '/welcome/': '/welcome/index.html',
      '/photos': '/photos/',
      '/photos/': '/photos/index.html',
      '/sundays': '/sundays/',
      '/sundays/': '/sundays/index.html',
      '/sauna': '/sauna/',
      '/sauna/': '/sauna/index.html',
      '/visiting-1': '/visiting-1/',
      '/visiting-1/': '/visiting-1/index.html',
      // Mistiq subsite
      '/mistiq': '/mistiq/',
      '/mistiq/': '/mistiq/index.html',
      '/mistiq/apply': '/mistiq/apply/',
      '/mistiq/apply/': '/mistiq/apply/index.html',
      // Spaces app — Phase 4 renamed /spaces/ → /rentals/. Keep these forever for old links.
      '/spaces': '/rentals/',
      '/spaces/': '/rentals/',
      '/spaces/events': '/rentals/hostevent/',
      '/spaces/events/': '/rentals/hostevent/',
      '/spaces/hostevent': '/rentals/hostevent/',
      // Rentals (Phase 4 destination)
      '/rentals': '/rentals/',
      '/rentals/': '/rentals/index.html',
      '/rentals/hostevent': '/rentals/hostevent/',
      '/rentals/hostevent/': '/rentals/hostevent/index.html',
      // Phase 1–3 new top-level folders
      '/staff': '/staff/',
      '/admin': '/admin/',
      '/devices': '/devices/',
      '/devices/': '/devices/devices.html',
      '/devcontrol': '/devcontrol/',
      '/devcontrol/': '/devcontrol/index.html',
      '/login': '/login/',
      '/login/': '/login/index.html',
      // Tesla OAuth callback
      '/auth/tesla/callback': '/auth/tesla/callback.html',
      // Kiosk/display
      '/kioskhall': '/kiosks/hall/',
      '/kiosks/hall/': '/kiosks/hall/index.html',
      // Claude sessions (alias for devcontrol)
      '/sessions': '/devcontrol/',
      '/sessions/': '/devcontrol/',
    };

    // Page-level redirects from old → new locations (Phases 1–4).
    // Permanent: emails, QR codes, and external bookmarks live forever.
    // Order matters — first match wins, so list specific entries before broad prefixes.
    // Functions can split a single old prefix into multiple new prefixes by sub-path,
    // and return null to fall through to the next rule (or the user-slug check).
    const STAFF_PAGES = new Set([
      'spaces.html','rentals.html','reservations.html','events.html','media.html',
      'sms-messages.html','purchases.html','worktracking.html','payments.html',
      'faq.html','voice.html','phyprop.html','inventory.html','appdev.html',
      'manage.html'
    ]);
    const ADMIN_PAGES = new Set([
      'users.html','passwords.html','settings.html','releases.html',
      'signatures.html','templates.html','brand.html','accounting.html',
      'notifications.html','testdev.html','test-suite.html','alpaclaw.html'
    ]);
    const DEVICE_PAGES = new Set([
      'devices.html','lighting.html','sonos.html','cameras.html','climate.html',
      'appliances.html','laundry.html','cars.html','car-history.html',
      'sensors.html','3dprinter.html','thermostat.js','washer-qr.svg'
    ]);

    const pathPrefixRedirects = [
      // Phase 1: DevControl
      { from: '/spaces/admin/devcontrol/', to: function(rest) { return '/devcontrol/' + rest; } },
      { from: '/spaces/admin/devcontrol',  to: function(rest) { return '/devcontrol/' + rest; } },
      // Phase 2: Devices — only map known device files; non-device /residents/* still resolves directly
      { from: '/residents/', to: function(rest) {
          var firstSeg = rest.split(/[?#]/)[0].split('/')[0];
          return DEVICE_PAGES.has(firstSeg) ? '/devices/' + rest : null;
      } },
      // Phase 3: Staff/Admin split
      { from: '/spaces/admin/', to: function(rest) {
          var firstSeg = rest.split(/[?#]/)[0].split('/')[0];
          if (STAFF_PAGES.has(firstSeg)) return '/staff/' + rest;
          if (ADMIN_PAGES.has(firstSeg)) return '/admin/' + rest;
          // Fall through: shared admin assets (styles.css, manage-shared.css, etc.) stay put for now
          return null;
      } },
      // Phase 4: Rentals (must come AFTER /spaces/admin/ — broader prefix)
      { from: '/spaces/', to: function(rest) { return '/rentals/' + rest; } },
    ];

    // Reserved top-level paths (existing directories/files — never treat as user slugs).
    // Old folders ('spaces') stay reserved so they keep redirecting and never collide with user slugs.
    const RESERVED_PATHS = [
      'spaces', 'residents', 'associates', 'login', 'shared', 'mobile',
      'supabase', 'auth', 'scripts', 'visiting', 'visiting-1', 'lost',
      'index', 'directory', 'kioskhall', 'welcome', 'photos', 'sundays',
      'sauna',
      'orientation', 'overnight', 'worktrade', 'contact', 'community',
      'events', 'mistiq', 'docs', 'assets', 'styles',
      'bug-reporter-extension', 'bug-reporter-firefox', 'bug-fixer',
      'feature-builder', 'camera-event-poller', 'image-gen',
      'lg-poller', 'tesla-poller', 'spirit-whisper-worker',
      'migrations', '.well-known', 'alpacapps', 'sessions',
      // Phase 1–4 new top-level folders
      'devcontrol', 'devices', 'staff', 'admin', 'rentals'
    ];

    // Resolve a redirect target via prefix engine. Returns null if no rule matches.
    function resolvePrefixRedirect(p) {
      for (var i = 0; i < pathPrefixRedirects.length; i++) {
        var rule = pathPrefixRedirects[i];
        if (p.indexOf(rule.from) === 0) {
          var rest = p.slice(rule.from.length);
          var target = typeof rule.to === 'function' ? rule.to(rest) : rule.to;
          if (target) return target;
        }
      }
      return null;
    }

    // Check exact path first, then prefix engine, then user-slug fallback.
    if (validPaths[path]) {
      window.location.replace(validPaths[path] + window.location.search + window.location.hash);
    } else {
      var prefixTarget = resolvePrefixRedirect(path);
      if (prefixTarget) {
        window.location.replace(prefixTarget + window.location.search + window.location.hash);
      } else {
        // Check if this is a user slug (single root-level segment like /haydn)
        const segments = path.replace(/^\/|\/$/g, '').split('/');
        if (segments.length === 1 && segments[0] && !RESERVED_PATHS.includes(segments[0].toLowerCase())) {
          // Looks like a personal directory URL — redirect to directory template
          window.location.replace('/directory/?slug=' + encodeURIComponent(segments[0].toLowerCase()));
        } else {
          // Unknown path — show the 404 page
          document.getElementById('notFoundPage').style.display = 'flex';
        }
      }
    }
  </script>
  <style>
    :root {
      --bg: #110e10;
      --card: #1e1a1c;
      --card-border: #2e282b;
      --text: #f5f4ed;
      --text-secondary: #c4b8bc;
      --text-muted: #8a7e82;
      --accent: #e99c48;
      --accent-soft: rgba(233, 156, 72, 0.15);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      min-height: 100vh;
    }

    #notFoundPage {
      display: none;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem;
      max-width: 520px;
      width: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .message {
      font-size: 1.25rem;
      color: var(--text-secondary);
      text-align: center;
    }

    .fact-card {
      background: linear-gradient(135deg, var(--card) 0%, rgba(233, 156, 72, 0.06) 100%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem 1.75rem;
      text-align: center;
      width: 100%;
    }

    .fact-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .fact-text {
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--text-secondary);
      font-style: italic;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent-soft);
      border: 1px solid rgba(233, 156, 72, 0.25);
      border-radius: 20px;
      padding: 0.5rem 1.25rem;
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s;
    }

    .nav-link:hover {
      background: rgba(233, 156, 72, 0.25);
    }

    .footer {
      font-size: 0.6rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="notFoundPage">
    <div class="container">
      <div class="header">
        <img src="https://pub-5a7344c4dab2467eb917ff4b897e066d.r2.dev/housephotos/logos/alpaca-head-white-transparent.png"
             alt="" class="logo">
        <h1>Alpaca Playhouse</h1>
      </div>

      <div class="code">404</div>
      <p class="message">This page could not be found.</p>

      <div class="fact-card">
        <div class="fact-label">Alpaca Fact</div>
        <p class="fact-text" id="factText">Alpacas hum to communicate with each other. A mother alpaca hums to her baby (called a cria) almost constantly.</p>
      </div>

      <a href="/" class="nav-link">Go Home</a>

      <div class="footer">
        <span class="kiosk-version"></span>
      </div>
    </div>
  </div>

  <script>
    const facts = [
      "Alpacas hum to communicate with each other. A mother alpaca hums to her baby (called a cria) almost constantly.",
      "Alpaca fiber comes in over 22 natural colors, more than any other fiber-producing animal.",
      "Alpacas are gentle on the environment \u2014 their padded feet don\u2019t tear up the ground like hooves do.",
      "A group of alpacas is called a herd, and they are very social animals that get stressed when alone.",
      "Alpacas can live at altitudes over 15,000 feet in the Andes mountains of South America.",
      "Unlike llamas, alpacas rarely spit at humans \u2014 they mostly spit at each other over food.",
      "Alpacas have been domesticated for over 6,000 years, originally by the Inca civilization.",
      "Baby alpacas (crias) can stand and walk within an hour of being born.",
      "Alpacas have excellent memory and can remember other alpacas they haven\u2019t seen in years.",
      "Alpaca fiber is naturally hypoallergenic because it contains no lanolin.",
      "Alpacas use a communal dung pile, which makes them easy to house-train \u2014 yes, really.",
      "An alpaca\u2019s top speed is about 35 mph, surprisingly fast for such fluffy creatures.",
    ];
    const el = document.getElementById('factText');
    if (el) el.textContent = facts[Math.floor(Math.random() * facts.length)];
  </script>
</body>
</html>
