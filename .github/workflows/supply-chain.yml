name: Supply-chain security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check lockfile, action pins and privilege isolation
        run: node scripts/check-supply-chain.mjs
      - name: Test the policy against unsafe fixtures
        run: node --test scripts/supply-chain.test.mjs
      - name: Audit locked dependencies without installation
        run: node scripts/check-dependency-audit.mjs
      - name: Preserve full dependency findings including accepted debt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 30
