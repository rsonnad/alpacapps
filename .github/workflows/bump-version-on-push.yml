# Bump version on every push to main.
# Runs only when the push is NOT our own bump commit ([skip ci]), so we avoid a loop.
# Version is recorded via Supabase REST API (HTTPS), then HTML + version.json are updated.
#
# FORK SAFETY: This workflow only runs on the original rsonnad/alpacapps repo.
# If you forked this repo, this workflow will be skipped automatically.
# You can safely delete this file from your fork.

name: Bump version on push to main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-main-sequence
  cancel-in-progress: false

jobs:
  bump:
    if: github.repository == 'rsonnad/alpacapps' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Tailwind CSS
        run: npm ci && npm run css:build

      - name: Check route constants are in sync (shared/routes.js ↔ supabase/functions/_shared/routes.ts)
        run: node scripts/sync-routes.js --check

      - name: Regenerate Rahulio pages manifest
        run: npm run rahulio-pages-manifest

      - name: Bump version (REST API + HTML + version.json)
        if: github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_PUSH_SHA: ${{ github.sha }}
          RELEASE_COMPARE_FROM_SHA: ${{ github.event.before }}
          RELEASE_COMPARE_TO_SHA: ${{ github.sha }}
          RELEASE_ACTOR_LOGIN: ${{ github.actor }}
          RELEASE_BRANCH: main
          RELEASE_PUSHED_AT: ${{ github.event.head_commit.timestamp }}
          RELEASE_SOURCE: github-main-push
        run: ./scripts/bump-version.sh --model ci

      - name: Commit and push version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Prepare committed static site
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          git archive HEAD -- . ':!mistiq' | tar -x -C "$RUNNER_TEMP/pages-site"
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/pages-site/_deployment.json", JSON.stringify({sha: require("child_process").execFileSync("git", ["rev-parse", "HEAD"], {encoding: "utf8"}).trim()}))'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload committed site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment and Muse pages
        env:
          PAGES_SITE_DIR: ${{ runner.temp }}/pages-site
        run: node scripts/verify-pages-deployment.mjs
