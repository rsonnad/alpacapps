<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.2" baseProfile="tiny-ps"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512" width="512" height="512">
  <title>PAI at the Alpaca Playhouse</title>

  <!-- Background: warm gradient circle -->
  <circle cx="256" cy="256" r="256" fill="#d4883a"/>
  <circle cx="256" cy="260" r="240" fill="#f5e6d0"/>

  <!-- Fluffy body/chest -->
  <ellipse cx="256" cy="380" rx="130" ry="90" fill="#faf5ee"/>
  <ellipse cx="256" cy="360" rx="110" ry="70" fill="#fff8f0"/>

  <!-- Fluffy head -->
  <ellipse cx="256" cy="240" rx="105" ry="95" fill="#faf5ee"/>
  <!-- Head highlight -->
  <ellipse cx="256" cy="230" rx="90" ry="80" fill="#fff8f0"/>
  <!-- Forehead fluff -->
  <ellipse cx="256" cy="170" rx="60" ry="30" fill="#faf5ee"/>
  <ellipse cx="240" cy="175" rx="35" ry="22" fill="#fff8f0"/>
  <ellipse cx="272" cy="175" rx="35" ry="22" fill="#fff8f0"/>

  <!-- Left ear -->
  <ellipse cx="190" cy="160" rx="20" ry="42" fill="#f0e0cc" transform="rotate(-10,190,160)"/>
  <ellipse cx="190" cy="160" rx="12" ry="30" fill="#f5c8a8" transform="rotate(-10,190,160)"/>
  <!-- Right ear -->
  <ellipse cx="318" cy="162" rx="20" ry="40" fill="#f0e0cc" transform="rotate(10,318,162)"/>
  <ellipse cx="318" cy="162" rx="12" ry="28" fill="#f5c8a8" transform="rotate(10,318,162)"/>

  <!-- Headband -->
  <rect x="165" y="185" width="182" height="14" rx="7" fill="#e8a060"/>
  <rect x="165" y="185" width="182" height="10" rx="5" fill="#c27840"/>
  <!-- Headband pattern -->
  <rect x="200" y="186" width="8" height="8" rx="1" fill="#e8c898"/>
  <rect x="220" y="186" width="8" height="8" rx="1" fill="#78c8c0"/>
  <rect x="240" y="186" width="8" height="8" rx="1" fill="#e8c898"/>
  <rect x="260" y="186" width="8" height="8" rx="1" fill="#78c8c0"/>
  <rect x="280" y="186" width="8" height="8" rx="1" fill="#e8c898"/>
  <rect x="300" y="186" width="8" height="8" rx="1" fill="#78c8c0"/>

  <!-- Moon crescent on headband -->
  <circle cx="256" cy="178" r="12" fill="#f0d060"/>
  <circle cx="260" cy="175" r="9" fill="#c27840"/>

  <!-- Left tassel -->
  <rect x="165" y="195" width="5" height="30" rx="2" fill="#5898c0"/>
  <circle cx="168" cy="228" r="4" fill="#5898c0"/>
  <rect x="175" y="195" width="5" height="24" rx="2" fill="#e07050"/>
  <circle cx="178" cy="222" r="4" fill="#e07050"/>

  <!-- Right tassel -->
  <rect x="330" y="195" width="5" height="30" rx="2" fill="#5898c0"/>
  <circle cx="333" cy="228" r="4" fill="#5898c0"/>
  <rect x="340" y="195" width="5" height="24" rx="2" fill="#e07050"/>
  <circle cx="343" cy="222" r="4" fill="#e07050"/>

  <!-- Eyes -->
  <ellipse cx="220" cy="245" rx="18" ry="20" fill="#3a2218"/>
  <ellipse cx="292" cy="245" rx="18" ry="20" fill="#3a2218"/>
  <!-- Eye highlights -->
  <circle cx="226" cy="238" r="7" fill="#ffffff"/>
  <circle cx="298" cy="238" r="7" fill="#ffffff"/>
  <circle cx="215" cy="248" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="287" cy="248" r="4" fill="#ffffff" opacity="0.6"/>
  <!-- Iris color -->
  <ellipse cx="220" cy="248" rx="10" ry="11" fill="#6b3a1a"/>
  <circle cx="225" cy="240" r="6" fill="#ffffff"/>
  <circle cx="297" cy="240" r="6" fill="#ffffff"/>
  <ellipse cx="292" cy="248" rx="10" ry="11" fill="#6b3a1a"/>

  <!-- Nose -->
  <ellipse cx="256" cy="280" rx="10" ry="7" fill="#d4a088"/>

  <!-- Smile -->
  <ellipse cx="256" cy="295" rx="22" ry="10" fill="none" stroke="#c09080" stroke-width="2.5"/>
  <rect x="234" y="285" width="44" height="12" fill="#fff8f0"/>

  <!-- Cheek blush -->
  <circle cx="195" cy="275" r="18" fill="#f0b8a0" opacity="0.4"/>
  <circle cx="317" cy="275" r="18" fill="#f0b8a0" opacity="0.4"/>

  <!-- Necklace -->
  <ellipse cx="256" cy="335" rx="65" ry="12" fill="none" stroke="#c8985a" stroke-width="3"/>
  <!-- Turquoise pendant -->
  <circle cx="256" cy="347" r="10" fill="#58b8b0"/>
  <circle cx="256" cy="347" r="6" fill="#78d8d0"/>
  <!-- Side beads -->
  <circle cx="225" cy="332" r="5" fill="#58b8b0"/>
  <circle cx="287" cy="332" r="5" fill="#58b8b0"/>
  <circle cx="205" cy="336" r="4" fill="#c8985a"/>
  <circle cx="307" cy="336" r="4" fill="#c8985a"/>
</svg>
