    const _i = (d) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

    // Sections: tone matches /styles/ix.css data-tone palette.
    // `updated` = last git commit date of the file; refresh when docs change.
    const SECTIONS = [
      { id: 'core',     title: 'Core Reference', tone: 'blue',   tagline: 'Schema, patterns, deploys, testing, and secrets.',
        icon: _i('<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>') },
      { id: 'devices',  title: 'Home & Devices', tone: 'teal',   tagline: 'Lighting, Sonos, Home Assistant, and maker tools.',
        icon: _i('<path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0018 8 6 6 0 006 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 018.91 14"/>') },
      { id: 'agents',   title: 'AI Agents',      tone: 'violet', tagline: 'AlpaClaw, OpenClaw, shared memory, and local models.',
        icon: _i('<rect x="4" y="7" width="16" height="12" rx="2"/><path d="M12 3v4"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/>') },
      { id: 'infra',    title: 'Infrastructure', tone: 'slate',  tagline: 'The Alpuca Mac, remote access, and hosting.',
        icon: _i('<rect x="2" y="3" width="20" height="7" rx="1.5"/><rect x="2" y="14" width="20" height="7" rx="1.5"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/>') },
      { id: 'cad',      title: 'CAD & Property', tone: 'amber',  tagline: 'Site plans, GIS, and 3D property renders.',
        icon: _i('<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>') },
      { id: 'planning', title: 'Planning',       tone: 'rose',   tagline: 'Feature plans and effort assessments.',
        icon: _i('<path d="M9 2h6a1 1 0 011 1v2h3a1 1 0 011 1v15a2 2 0 01-2 2H6a2 2 0 01-2-2V6a1 1 0 011-1h3V3a1 1 0 011-1z"/><path d="M9 14l2 2 4-4"/>') },
    ];

    const DOCS = [
      // Core Reference
      { file: 'CHANGELOG.md',       section: 'core', updated: '2026-09-29', title: 'Changelog',            desc: 'Running log of significant changes, migrations, and feature launches.' },
      { file: 'SCHEMA.md',          section: 'core', updated: '2026-09-29', title: 'Database Schema',      desc: 'Every Supabase table, column, type, and relationship — the source of truth for data modeling.' },
      { file: 'DEPLOY.md',          section: 'core', updated: '2026-04-28', title: 'Deployment Workflow',  desc: 'GitHub Pages deploys, CI version bumps, push protocol, and edge function deploys.' },
      { file: 'PATTERNS.md',        section: 'core', updated: '2026-04-28', title: 'Patterns & Conventions', desc: 'Tailwind aap-* tokens, component patterns, showToast/openLightbox, and UI code standards.' },
      { file: 'KEY-FILES.md',       section: 'core', updated: '2026-05-10', title: 'Key Files',            desc: 'Where to find pages, shared modules, config, and styles.' },
      { file: 'INTEGRATIONS.md',    section: 'core', updated: '2026-05-11', title: 'Integrations & API Costs', desc: 'Every external API — Stripe, Twilio, Gemini, Nest, Tesla — with pricing and rate limits.' },
      { file: 'TESTING-GUIDE.md',   section: 'core', updated: '2026-04-28', title: 'Testing Guide',        desc: 'Test accounts, auth testing, QA workflows, and admin page testing.' },
      { file: 'SECRETS-GUIDE.md',   section: 'core', updated: '2026-04-28', title: 'Secrets Management',   desc: 'Bitwarden CLI, the bw-read helper, and credential access patterns.' },
      { file: 'CLAUDE-TEMPLATE.md', section: 'core', updated: '2026-04-28', title: 'CLAUDE.md Templates',  desc: 'Templates for generating CLAUDE.md per persona and feature set in the setup wizard.' },
      // Home & Devices
      { file: 'HOMEAUTOMATION.md',  section: 'devices', updated: '2026-09-24', title: 'Home Automation',    desc: 'All smart home devices, Home Assistant setup, Nest, cameras, and migration plans.' },
      { file: 'LIGHTINGAUTOMATION.md', section: 'devices', updated: '2026-09-24', title: 'Lighting Automation', desc: 'Light entity IDs, room commands, color reference, and HAOS control patterns.' },
      { file: 'home-assistant-lighting-design.md', section: 'devices', updated: '2026-04-28', title: 'HA Unified Lighting Design', desc: 'Target architecture for unified HAOS lighting — entity naming, automation templates, migration status.' },
      { file: 'SONOSAUTOMATION.md', section: 'devices', updated: '2026-09-29', title: 'Sonos Automation',   desc: 'Sonos network config, UDM Pro settings, and troubleshooting for 14-zone audio.' },
      { file: 'spotifyapi.md',      section: 'devices', updated: '2026-04-28', title: 'Spotify API',        desc: 'Playlist creation, OAuth flow, token refresh, and Dev Mode limits.' },
      { file: 'music-assistant-alpaca-mac-setup.md', section: 'devices', updated: '2026-05-15', title: 'Music Assistant Setup', desc: 'Docker setup for Music Assistant on the Mac mini — local music and scheduled playback.' },
      { file: 'music-assistant-api-mapping.md', section: 'devices', updated: '2026-05-15', title: 'Music Assistant API Mapping', desc: 'Maps sonos-control edge function actions to Music Assistant API commands.' },
      { file: 'MUSIC-ASSISTANT-EVALUATION.md', section: 'devices', updated: '2026-04-28', title: 'Music Assistant Evaluation', desc: 'Whether to replace node-sonos-http-api with Music Assistant as the Sonos controller.' },
      { file: 'alexa-master-pasture-skill.md', section: 'devices', updated: '2026-04-28', title: 'Alexa Master Pasture Skill', desc: 'Custom Alexa skill backed by a Supabase edge function for voice lighting scenes.' },
      { file: 'MAKERDEVICES.md',    section: 'devices', updated: '2026-05-12', title: 'Maker Devices',      desc: 'Glowforge laser cutter and FlashForge 3D printer — edge functions, tables, troubleshooting.' },
      { file: 'sponic-tablet-setup.md', section: 'devices', updated: '2026-05-31', title: 'Sponic Tablet Setup', desc: 'Galaxy Tab A9+ setup: Tailscale, wireless adb on 5555, and the LangBang boot helper.' },
      // AI Agents
      { file: 'clawlikeagents.md',  section: 'agents', updated: '2026-04-28', title: 'AI Agents Overview',   desc: 'Every agent serving the property — AlpaClaw, PAI, Hermes — plus model routing and adding new ones.' },
      { file: 'OPENCLAW_SAFE_PARTITIONED.md', section: 'agents', updated: '2026-04-28', title: 'OpenClaw: Safe & Partitioned', desc: 'Running OpenClaw in a partitioned config with limited resident exposure.' },
      { file: 'slack-alpaclaw-reinstall.md', section: 'agents', updated: '2026-04-28', title: 'Slack AlpaClaw Reinstall', desc: 'Reinstalling the AlpaClaw Slack bot after scope or event changes.' },
      { file: 'OPEN-BRAIN-SETUP.md', section: 'agents', updated: '2026-04-28', title: 'Open Brain',          desc: 'Shared AI memory — Slack capture, pgvector embeddings, semantic search over MCP.' },
      { file: 'LOCAL-AI-SETUP.md',  section: 'agents', updated: '2026-05-25', title: 'Local AI Setup',       desc: 'Ollama and local models on Apple Silicon — model choice, Qwen, and storage.' },
      // Infrastructure
      { file: 'ALPUCA-MACHINE.md',  section: 'infra', updated: '2026-09-08', title: 'Alpuca Machine',       desc: 'The primary Mac: hardware, background services, runaway-process diagnostics, and tripwires.' },
      { file: 'REMOTE-ACCESS.md',   section: 'infra', updated: '2026-09-29', title: 'Remote Access',        desc: 'SSH into Alpuca and the UDM Pro from off the home LAN — Tailscale, tunnels, port forwarding.' },
      { file: 'alpaca-mac-media-tools.md', section: 'infra', updated: '2026-04-28', title: 'Media & Video Tools', desc: 'FFmpeg, yt-dlp, and media tools installed on the Alpuca Mac mini.' },
      { file: 'AWS_VS_DIGITALOCEAN_COMPARISON.md', section: 'infra', updated: '2026-04-28', title: 'AWS vs DigitalOcean', desc: 'Cost and feature comparison for hosting workers, bots, and proxies.' },
      // CAD & Property
      { file: 'CAD.md',             section: 'cad', updated: '2026-04-28', title: 'CAD Tool Reference',     desc: 'Blender, QGIS, and PostGIS for the 3D property twin and site plans.' },
      { file: 'CAD-SITE-PLANS.md',  section: 'cad', updated: '2026-04-28', title: 'Site Plans — Setup & Usage', desc: 'County-permit-ready site plans for 160 Still Forest Dr with open-source GIS.' },
      { file: 'SITE-PLAN-PIPELINE.md', section: 'cad', updated: '2026-09-24', title: 'Site Plan & Render Pipeline', desc: 'Full context: PostGIS tables, data sources, and the rendering pipeline.' },
      { file: 'CAD-RENDER-PIPELINE.md', section: 'cad', updated: '2026-04-28', title: '3D Render Pipeline', desc: 'Photorealistic property renders and the on-site data they need.' },
      { file: 'SITE-rendering-log.md', section: 'cad', updated: '2026-04-28', title: 'Site Rendering Log',  desc: 'Log from the autonomous render → compare → correct loop on Alpuca.' },
      // Planning
      { file: 'DEMO_MODE_FEATURE_PLAN.md', section: 'planning', updated: '2026-04-28', title: 'Demo Mode Plan', desc: 'Read-only demo role with redacted sensitive data.' },
      { file: 'MULTI_TENANCY_EFFORT_ASSESSMENT.md', section: 'planning', updated: '2026-04-28', title: 'Multi-Tenancy Assessment', desc: 'Schema, RLS, UI, and migration effort to make AlpacApps multi-tenant.' },
    ];

    const RECENT_COUNT = 6;
    const sectionById = Object.fromEntries(SECTIONS.map((s) => [s.id, s]));

    function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    const el = (id) => document.getElementById(id);

    function fmtDate(iso) {
      const d = new Date(iso + 'T12:00:00');
      const days = Math.floor((Date.now() - d) / 86400000);
      if (days <= 0) return 'today';
      if (days === 1) return 'yesterday';
      if (days < 7) return `${days}d ago`;
      const sameYear = d.getFullYear() === new Date().getFullYear();
      return d.toLocaleDateString('en-US', sameYear ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function cardHtml(d, tone) {
      const search = `${d.title} ${d.desc} ${d.file} ${sectionById[d.section].title}`.toLowerCase();
      return `
        <a class="ix-card" href="${esc(d.file)}" target="_blank" rel="noopener" data-tone="${tone}" data-search="${esc(search)}" aria-label="${esc(d.title)} — ${esc(d.desc)}">
          <span class="ix-card-icon" aria-hidden="true">${sectionById[d.section].icon}</span>
          <span class="ix-card-body">
            <span class="ix-card-title">${esc(d.title)}</span>
            <span class="ix-card-desc">${esc(d.desc)}</span>
            <span class="ix-card-meta">Updated ${fmtDate(d.updated)} · <code>${esc(d.file)}</code></span>
          </span>
        </a>`;
    }

    // cardTone(d) optionally overrides each card's tone (default: the section's)
    function sectionHtml({ id, title, tone, tagline, icon }, docs, cardTone) {
      return `
        <section class="ix-section" id="sec-${id}" data-section="${id}" data-tone="${tone}">
          <div class="ix-section-head">
            <span class="ix-section-icon" aria-hidden="true">${icon}</span>
            <div class="ix-section-text">
              <h2 class="ix-section-title">${esc(title)} <span class="ix-section-count">${docs.length}</span></h2>
              <p class="ix-section-tagline">${esc(tagline)}</p>
            </div>
          </div>
          <div class="ix-groups"><div class="ix-group"><div class="ix-grid">
            ${docs.map((d) => cardHtml(d, cardTone ? cardTone(d) : tone)).join('')}
          </div></div></div>
        </section>`;
    }

    function render() {
      // "Recently updated" cards keep their own section's color so you can tell where they live.
      const recent = [...DOCS].sort((a, b) => b.updated.localeCompare(a.updated)).slice(0, RECENT_COUNT);
      const recentSection = { id: 'recent', title: 'Recently updated', tone: 'orange', tagline: 'The most recently changed docs.',
        icon: _i('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>') };
      el('docsRoot').innerHTML =
        `<div data-recent>${sectionHtml(recentSection, recent, (d) => sectionById[d.section].tone)}</div>` +
        SECTIONS.map((s) => sectionHtml(s, DOCS.filter((d) => d.section === s.id))).join('');

      el('docsJump').innerHTML = SECTIONS.map((s) => `
        <a class="ix-chip" href="#sec-${s.id}" data-section="${s.id}" data-tone="${s.tone}">
          ${esc(s.title)}<span class="ix-chip-count">${DOCS.filter((d) => d.section === s.id).length}</span>
        </a>`).join('');
    }

    function applyFilter() {
      const q = el('searchInput').value.trim().toLowerCase();
      // Hide the "Recently updated" duplicates while searching
      el('docsRoot').querySelector('[data-recent]')?.classList.toggle('hidden', !!q);
      let shown = 0;
      el('docsRoot').querySelectorAll(':scope > .ix-section').forEach((section) => {
        let n = 0;
        section.querySelectorAll('.ix-card').forEach((card) => {
          const match = !q || card.dataset.search.includes(q);
          card.classList.toggle('hidden', !match);
          if (match) n++;
        });
        section.classList.toggle('hidden', !n);
        document.querySelector(`.ix-chip[data-section="${section.dataset.section}"]`)?.classList.toggle('ix-chip--dim', !n);
        shown += n;
      });
      el('noMatch').classList.toggle('hidden', !q || shown > 0);
    }

    function wireSearch() {
      const input = el('searchInput');
      input.addEventListener('input', applyFilter);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (!input.value.trim()) return;
          const first = el('docsRoot').querySelector(':scope > .ix-section .ix-card:not(.hidden)');
          if (first) window.open(first.getAttribute('href'), '_blank', 'noopener');
        } else if (e.key === 'Escape') {
          input.value = '';
          applyFilter();
          input.blur();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== input && !e.metaKey && !e.ctrlKey) {
          e.preventDefault();
          input.focus();
        }
      });
    }

    function injectSiteHeader() {
      const version = document.querySelector('[data-site-version]')?.textContent?.trim() || '';
      el('siteHeader').innerHTML = renderHeader({ transparent: false, light: false, version, showRoleBadge: true });
      initSiteComponents();
      setupVersionInfo();
      initPublicHeaderAuth({ authContainerId: 'aapHeaderAuth', signInLinkId: 'aapSignInLink' });
    }

    async function init() {
      injectSiteHeader();
      const wall = el('authWall');
      try {
        await initAuth();
        const role = getAuthState()?.appUser?.role;
        const ALLOWED = ['admin', 'oracle', 'staff', 'associate'];
        if (!role || !ALLOWED.includes(role)) {
          wall.innerHTML = 'Dev Docs are for associates and above. <a href="/login/?redirect=%2Fdevcontrol%2Fdevdocs%2F">Sign in</a>';
          return;
        }
      } catch (err) {
        console.error('[DEVDOCS]', 'initAuth failed', err);
        wall.innerHTML = 'Couldn’t check your access. <a href="/login/?redirect=%2Fdevcontrol%2Fdevdocs%2F">Sign in</a>';
        return;
      }
      wall.classList.add('hidden');
      el('searchWrap').classList.remove('hidden');
      el('docsJump').classList.remove('hidden');
      el('docsMeta').textContent = `${DOCS.length} internal development documents. Press / to search.`;
      render();
      wireSearch();
    }

    init();
  </script>
</body>
