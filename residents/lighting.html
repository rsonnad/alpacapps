<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="preconnect" href="https://aphrrfprbixmhissnjfn.supabase.co">
  <title>Lighting - AlpacAPPs Residents</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <script>try{var c=localStorage.getItem("genalpaca-cached-auth");if(c&&JSON.parse(c).appUser)document.documentElement.dataset.cachedAuth="1"}catch(e){}</script>
  <style>.hidden{display:none!important}[data-cached-auth] #loadingOverlay{display:none!important}[data-cached-auth] #appContent.hidden{display:block!important}#loadingOverlay{position:fixed;inset:0;background:#f6f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}.loading-overlay__logo{display:flex;align-items:center;gap:.75rem}.loading-overlay__icon{height:40px;width:auto;max-width:none}.loading-overlay__wordmark{height:28px;width:auto;max-width:none}</style>
  <link rel="stylesheet" href="../spaces/styles.css?v=5">
  <link rel="stylesheet" href="../spaces/admin/styles.css?v=5">
  <link rel="stylesheet" href="../spaces/admin/manage-shared.css?v=5">
  <link rel="stylesheet" href="residents.css?v=5">
  <script type="module" src="../shared/version-info.js"></script>
  <link rel="stylesheet" href="../styles/site.css">
  <link rel="stylesheet" href="../styles/tailwind.out.css">
</head>
<body>
  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-overlay__logo">
      <img src="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/housephotos/logos/alpaca-head-black-transparent.png" alt="" class="loading-overlay__icon" width="28" height="40">
      <img src="https://aphrrfprbixmhissnjfn.supabase.co/storage/v1/object/public/housephotos/logos/wordmark-black-transparent.png" alt="Alpaca Playhouse" class="loading-overlay__wordmark" width="28" height="28">
    </div>
    <div class="spinner spinner--sm"></div>
  </div>

  <!-- Access denied (populated by JS) -->
  <div id="unauthorizedOverlay" class="loading-overlay hidden"></div>

  <!-- Main app content -->
  <div id="appContent" class="hidden">
    <div id="siteHeader"></div>

    <span data-site-version style="display:none">v260224.04 11:08a</span>

    <div class="context-switcher hidden" id="contextSwitcher">
      <a class="context-switcher-btn active">Resident</a>
      <a href="/spaces/admin/" class="context-switcher-btn">Staff</a>
    </div>

    <!-- Tab Navigation -->
    <div class="manage-tabs" id="tabNav"></div>

    <!-- Main Content -->
    <main class="manage-content homeauto-page">

      <!-- ===== LIGHTING SECTION ===== -->
      <section class="section" id="lightingSection">
        <div class="section-header">
          <h2>Lighting Groups</h2>
          <div class="section-header-actions">
            <button class="btn-small" id="refreshBtn" title="Refresh all light states">Refresh</button>
            <button class="btn-all-off" id="allOffBtn" title="Turn off all lighting groups">All Off</button>
          </div>
        </div>
        <div class="section-body">
          <div class="lighting-groups" id="lightingGroups">
            <!-- Rendered by JS -->
          </div>
          <div class="poll-status" id="pollStatus"></div>
        </div>
      </section>

      <!-- ===== LIGHTING SETTINGS (Admin Only) ===== -->
      <section class="section admin-only" id="lightingSettingsSection">
        <div class="section-header">
          <h2>Lighting Settings</h2>
          <span class="settings-badge" id="goveeModeBadge">Loading...</span>
        </div>
        <div class="section-body">
          <label class="settings-toggle">
            <input type="checkbox" id="goveeTestMode">
            <span class="settings-toggle-label">Test Mode</span>
            <span class="settings-toggle-hint">Log commands without calling Govee API</span>
          </label>

          <div style="margin-top: 1rem;">
            <button class="btn-small" id="syncCapabilitiesBtn">Sync Capabilities</button>
            <span class="text-muted" style="font-size: 0.75rem; margin-left: 0.5rem;">
              Fetch device capabilities &amp; segment info from Govee API
            </span>
          </div>

          <div style="margin-top: 1rem;">
            <h3 style="font-size: 0.85rem; margin-bottom: 0.5rem;">Device Inventory <span class="text-muted" id="goveeDeviceCount" style="font-weight:400;"></span></h3>
            <div id="goveeDeviceSummary">
              <p class="text-muted" style="font-size: 0.85rem;">Loading...</p>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- Instant chrome: skip spinner + pre-render header for returning users -->
  <script src="../shared/instant-chrome.js"></script>

  <script src="/vendor/supabase-js-2.39.3.min.js"></script>
  <script type="module" src="lighting.js"></script>
</body>
</html>
