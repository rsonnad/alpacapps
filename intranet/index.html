<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Intranet — AlpacAPPs</title>
  <meta name="description" content="Staff & admin landing page — quick links to every internal AlpacAPPs tool: spaces, rentals, reservations, payments, users, settings, DevControl, and more.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/rentals/styles.css?v=5">
  <link rel="stylesheet" href="/rentals/admin/styles.css?v=5">
  <link rel="stylesheet" href="/rentals/admin/manage-shared.css?v=5">
  <link rel="stylesheet" href="/styles/site.css">
  <link rel="stylesheet" href="/styles/tailwind.out.css">
  <style>
    .hidden { display: none !important; }

    body { background: var(--bg, #f6f5f0); margin: 0; font-family: 'DM Sans', system-ui, -apple-system, sans-serif; color: var(--text, #1f1720); }

    /* Self-contained header so we never depend on remote image loads */
    .intranet-topbar {
      display: flex; align-items: center; gap: 0.6rem;
      padding: calc(0.65rem + env(safe-area-inset-top, 0px)) 1rem 0.65rem;
      background: #1f1720; color: #f6f5f0;
      position: sticky; top: 0; z-index: 50;
    }
    .intranet-topbar__brand {
      display: flex; align-items: center; gap: 0.55rem;
      text-decoration: none; color: inherit;
    }
    .intranet-topbar__icon {
      width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .intranet-topbar__title {
      font-weight: 700; font-size: 1rem; letter-spacing: 0.01em;
    }
    .intranet-topbar__spacer { flex: 1; }
    .intranet-topbar__signout {
      background: transparent; border: 1px solid rgba(255,255,255,0.25);
      color: #f6f5f0; padding: 0.3rem 0.7rem; border-radius: 999px;
      font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    .intranet-topbar__signout:hover { background: rgba(255,255,255,0.08); }

    .intranet-page { max-width: 1100px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .intranet-header { margin: 0.25rem 0 1.1rem; }
    .intranet-header h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 0.25rem; }
    .intranet-header p { color: var(--text-muted, #6b6660); font-size: 0.9rem; margin: 0; }

    .intranet-section-title {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      font-weight: 700; color: var(--text-muted, #6b6660); margin: 1.4rem 0 0.55rem; padding-left: 0.1rem;
    }
    .intranet-section-title:first-of-type { margin-top: 0.25rem; }

    .intranet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.7rem;
    }
    .intranet-card {
      display: flex; flex-direction: column; gap: 0.4rem;
      background: #fff;
      border: 1px solid var(--border, #e6e2db);
      border-radius: 12px;
      padding: 0.85rem 0.95rem;
      text-decoration: none; color: inherit;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      transition: border-color .15s ease, transform .1s ease, box-shadow .15s ease;
      min-height: 92px;
    }
    .intranet-card:hover, .intranet-card:focus-visible {
      border-color: var(--accent, #e07a3a);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transform: translateY(-1px);
    }
    .intranet-card:focus-visible {
      outline: 2px solid var(--accent, #e07a3a);
      outline-offset: 2px;
    }
    .intranet-card-head { display: flex; align-items: center; gap: 0.55rem; }
    .intranet-card-icon {
      flex: 0 0 28px; width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--accent, #e07a3a);
      background: var(--bg, #f6f5f0);
      border-radius: 8px;
    }
    .intranet-card-icon svg { width: 16px; height: 16px; }
    .intranet-card-title { font-size: 0.98rem; font-weight: 600; line-height: 1.2; }
    .intranet-card-desc { font-size: 0.78rem; color: var(--text-muted, #6b6660); line-height: 1.35; }

    .intranet-status {
      padding: 1.1rem 1.2rem; margin-top: 0.5rem;
      background: #fff; border: 1px dashed var(--border, #e6e2db); border-radius: 12px;
      color: var(--text-muted, #6b6660); text-align: center; font-size: 0.92rem;
    }
    .intranet-status a {
      color: var(--accent, #e07a3a); font-weight: 600; text-decoration: none;
    }

    @media (max-width: 480px) {
      .intranet-page { padding: 0.85rem 0.75rem 2rem; }
      .intranet-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.55rem; }
      .intranet-card { padding: 0.7rem 0.7rem; min-height: 84px; }
      .intranet-card-title { font-size: 0.9rem; }
      .intranet-card-desc { font-size: 0.72rem; }
    }
  </style>
</head>
<body>
  <header class="intranet-topbar">
    <a class="intranet-topbar__brand" href="/">
      <span class="intranet-topbar__icon" aria-hidden="true">
        <svg viewBox="0 0 21 30" xmlns="http://www.w3.org/2000/svg">
          <path d="M10.5 1.5C8.3 1.5 6.5 3.3 6.5 5.5v4.1L3.8 13c-1 1.3-1.5 2.8-1.5 4.4 0 4.6 3.7 8.3 8.2 8.3s8.2-3.7 8.2-8.3c0-1.6-.5-3.2-1.5-4.4l-2.7-3.4V5.5c0-2.2-1.8-4-4-4z" fill="#f6f5f0"/>
          <ellipse cx="10.5" cy="18.6" rx="3.1" ry="4.7" fill="#1f1720"/>
        </svg>
      </span>
      <span class="intranet-topbar__title">Intranet</span>
    </a>
    <span class="intranet-topbar__spacer"></span>
    <button class="intranet-topbar__signout hidden" id="signOutBtn">Sign out</button>
  </header>

  <main class="intranet-page">
    <div class="intranet-header">
      <h1 id="intranetGreeting">Pick a section</h1>
      <p id="intranetSubtitle">Everything in the staff and admin areas, in one place.</p>
    </div>

    <h2 class="intranet-section-title hidden" id="staffSectionTitle">Staff</h2>
    <div class="intranet-grid" id="staffGrid"></div>

    <h2 class="intranet-section-title hidden" id="adminSectionTitle">Admin</h2>
    <div class="intranet-grid" id="adminGrid"></div>

    <div class="intranet-status hidden" id="intranetStatus"></div>

    <span data-site-version style="display:none">v260531.04 12:45p</span>
  </main>

  <script src="/vendor/supabase-js-2.39.3.min.js"></script>
  <script type="module" src="./intranet.js"></script>
</body>
</html>
