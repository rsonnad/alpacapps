  <style>.hidden{display:none!important}[data-cached-auth] #loadingOverlay{opacity:0!important;pointer-events:none!important;visibility:hidden!important}[data-cached-auth] #appContent.hidden{display:block!important}#loadingOverlay{position:fixed;inset:0;background:#f6f5f0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity .16s ease-out}.loading-overlay__logo{display:flex;align-items:center;gap:.75rem;min-height:40px}.loading-overlay__icon{height:40px;width:auto;max-width:none}.loading-overlay__wordmark{height:28px;width:auto;max-width:none}</style>
  <link rel="stylesheet" href="/rentals/styles.css?v=5">

  <link rel="stylesheet" href="/styles/site.css">
  <link rel="stylesheet" href="/styles/tailwind.out.css">
  <style>
    .intranet-page { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .intranet-header { margin-bottom: 1.5rem; }
    .intranet-header h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 0.25rem; }
    .intranet-header p { color: var(--text-muted); font-size: 0.9rem; margin: 0; }

    .intranet-section-title {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      font-weight: 700; color: var(--text-muted); margin: 1.5rem 0 0.6rem; padding-left: 0.1rem;
    }
    .intranet-section-title:first-of-type { margin-top: 0.25rem; }

    .intranet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.7rem;
    }
    .intranet-card {
      display: flex; flex-direction: column; gap: 0.4rem;
      background: var(--bg-card, #fff);
      border: 1px solid var(--border);
      border-radius: var(--radius, 10px);
      padding: 0.85rem 0.95rem;
      text-decoration: none; color: inherit;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      transition: border-color .15s ease, transform .1s ease, box-shadow .15s ease;
      min-height: 92px;
    }
    .intranet-card:hover, .intranet-card:focus {
      border-color: var(--accent, #e07a3a);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transform: translateY(-1px);
    }
    .intranet-card-head {
      display: flex; align-items: center; gap: 0.55rem;
    }
    .intranet-card-icon {
      flex: 0 0 28px; width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--accent, #e07a3a);
      background: var(--bg, #f6f5f0);
      border-radius: 8px;
    }
    .intranet-card-icon svg { width: 16px; height: 16px; }
    .intranet-card-title {
      font-size: 0.98rem; font-weight: 600; line-height: 1.2;
    }
    .intranet-card-desc {
      font-size: 0.78rem; color: var(--text-muted); line-height: 1.35;
    }
    .intranet-empty {
      padding: 1.5rem; text-align: center; color: var(--text-muted);
      border: 1px dashed var(--border); border-radius: var(--radius);
    }

    @media (max-width: 480px) {
      .intranet-page { padding: 0.9rem 0.75rem 2rem; }
      .intranet-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.55rem; }
      .intranet-card { padding: 0.7rem 0.7rem; min-height: 84px; }
      .intranet-card-title { font-size: 0.9rem; }
      .intranet-card-desc { font-size: 0.72rem; }
    }
  </style>
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-overlay__logo">
      <img src="https://pub-5a7344c4dab2467eb917ff4b897e066d.r2.dev/housephotos/logos/alpaca-head-black-transparent.png" alt="" class="loading-overlay__icon" width="28" height="40">
      <img src="https://pub-5a7344c4dab2467eb917ff4b897e066d.r2.dev/housephotos/logos/wordmark-black-transparent.png" alt="Alpaca Playhouse" class="loading-overlay__wordmark" width="28" height="28">
    </div>
    <div class="spinner spinner--sm"></div>
  </div>

  <div id="unauthorizedOverlay" class="loading-overlay hidden"></div>

  <div id="appContent" class="hidden">
    <div id="siteHeader"></div>

    <span data-site-version style="display:none">v260516.00</span>

    <main class="intranet-page">
      <div class="intranet-header">
        <h1>Intranet</h1>
        <p>Pick a section to jump in.</p>
      </div>

      <h2 class="intranet-section-title" id="staffSectionTitle" hidden>Staff</h2>
      <div class="intranet-grid" id="staffGrid"></div>

      <h2 class="intranet-section-title" id="adminSectionTitle" hidden>Admin</h2>
      <div class="intranet-grid" id="adminGrid"></div>

      <div class="intranet-empty hidden" id="intranetEmpty">
        You don't have permission to view any sections yet. Ask an admin to grant you access.
      </div>
    </main>
  </div>

  <script src="/shared/instant-chrome.js"></script>
  <script type="module" src="/shared/version-info.js"></script>
  <script src="/vendor/supabase-js-2.39.3.min.js"></script>
  <script type="module" src="./intranet.js"></script>
</body>
</html>
