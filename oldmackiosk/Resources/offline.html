<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OldMacKiosk — Offline</title>
    <style>
        body {
            background: #110e10;
            color: #e99c48;
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .emoji { font-size: 120px; margin-bottom: 20px; }
        h1 { font-size: 36px; margin: 0 0 10px; font-weight: 300; }
        p { color: #666; font-size: 18px; }
        .dot { animation: blink 1.5s infinite; }
        @keyframes blink {
            0%, 20% { opacity: 1; }
            50% { opacity: 0; }
            80%, 100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="emoji">🦙</div>
    <h1>No Connection</h1>
    <p>Retrying<span class="dot">.</span><span class="dot" style="animation-delay:.3s">.</span><span class="dot" style="animation-delay:.6s">.</span></p>
</body>
</html>
