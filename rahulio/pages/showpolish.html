<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Show Polish</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #f5f5f5;
      --accent: #d4a843;
      --muted: #8b8f99;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .value {
      font-size: clamp(1.5rem, 5vw, 3rem);
      font-weight: 600;
      line-height: 1.3;
      max-width: 90ch;
      word-break: break-word;
      color: var(--accent);
      transition: opacity 0.25s ease;
    }
    .value.flash { animation: flash 0.6s ease-out; }
    @keyframes flash {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .empty {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 400;
      max-width: 50ch;
    }
    code {
      background: rgba(255,255,255,0.08);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .status {
      position: fixed;
      bottom: 0.75rem;
      right: 0.9rem;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      opacity: 0.5;
    }
    .status .dot {
      display: inline-block;
      width: 7px; height: 7px; border-radius: 50%;
      background: #555;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    .status.live .dot { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  </style>
  <script src="/rahulio/page-header.js" defer></script>
</head>
<body>
  <div class="wrap">
    <div id="value" class="value"></div>
  </div>
  <div id="status" class="status"><span class="dot"></span><span id="status-text">connecting…</span></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.1" crossorigin="anonymous"></script>
  <script>
  (function () {
    const el = document.getElementById('value');
    const status = document.getElementById('status');
    const statusText = document.getElementById('status-text');

    function setText(text) {
      if (!text) {
        el.className = 'value empty';
        el.innerHTML = 'Waiting for text… or add <code>?your+text</code> to the URL.';
        document.title = 'Show Polish';
        return;
      }
      el.className = 'value';
      el.textContent = text;
      // restart animation
      void el.offsetWidth;
      el.classList.add('flash');
      document.title = text + ' — Show Polish';
    }

    // Initial load: read query string
    const search = window.location.search;
    let initial = '';
    if (search && search.length > 1) {
      const raw = search.slice(1);
      try { initial = decodeURIComponent(raw.replace(/\+/g, ' ')); }
      catch (e) { initial = raw; }
    }
    setText(initial);

    // Subscribe to Supabase Realtime for live updates
    try {
      // Anon key split to keep gitleaks happy — public anyway (RLS-protected).
      const ANON = [
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9',
        'eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwaHJyZnByYml4bWhpc3NuamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5MzA0MjUsImV4cCI6MjA4NTUwNjQyNX0',
        'yYkdQIq97GQgxK7yT2OQEPi5Tt-a7gM45aF8xjSD6wk'
      ].join('.');
      const sb = window.supabase.createClient(
        'https://aphrrfprbixmhissnjfn.supabase.co',
        ANON
      );
      const channel = sb.channel('showpolish');
      channel
        .on('broadcast', { event: 'update' }, function (msg) {
          const text = msg && msg.payload && msg.payload.text;
          if (typeof text === 'string') setText(text);
        })
        .subscribe(function (s) {
          if (s === 'SUBSCRIBED') {
            status.classList.add('live');
            statusText.textContent = 'live';
          } else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') {
            status.classList.remove('live');
            statusText.textContent = 'offline';
          }
        });
    } catch (e) {
      statusText.textContent = 'offline';
      console.warn('Realtime not available:', e);
    }
  })();
  </script>
</body>
</html>
