<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Justin Gilbertson — Hours &amp; Balance</title>
  <!-- Content is NOT in this file. It lives in Supabase `private_page_content`
       (slug below) behind RLS that only returns it to allow-listed emails. -->
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; background: #f5f5f0; color: #333; margin: 0; min-height: 100vh; }
    .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .gate.hidden { display: none; }
    .auth-form { background: #fff; border: 1px solid #e5e5e0; border-radius: 12px; padding: 2rem; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .auth-form h2 { font-size: 1.1rem; margin: 0 0 0.4rem; color: #2d3024; }
    .auth-form p { font-size: 0.82rem; color: #777; margin: 0 0 1.25rem; }
    .auth-form input { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid #d8d2c2; border-radius: 6px; font-size: 0.9rem; font-family: inherit; margin-bottom: 0.75rem; }
    .auth-form button { width: 100%; padding: 0.55rem; background: #2d3024; color: #fff; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .auth-form button:disabled { opacity: 0.6; cursor: default; }
    .auth-form .google-btn { background: #fff; color: #333; border: 1px solid #d8d2c2; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .auth-divider { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; color: #999; font-size: 0.75rem; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: #e5e5e0; }
    .auth-error { color: #b34c2e; font-size: 0.82rem; margin-bottom: 0.75rem; display: none; }
    .signed-in-bar { max-width: 1040px; margin: 1rem auto -1rem; padding: 0 1rem; font-size: 0.78rem; color: #888; text-align: right; }
    .signed-in-bar button { background: none; border: none; color: #4a6b2a; text-decoration: underline; cursor: pointer; font-size: inherit; padding: 0; font-family: inherit; }
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="auth-form">
      <h2>Private page</h2>
      <p id="gateMsg">Sign in to view this page.</p>
      <div class="auth-error" id="authError"></div>
      <div id="loginControls">
        <button class="google-btn" id="googleBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Sign in with Google
        </button>
        <div class="auth-divider">or</div>
        <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
        <button id="authSubmit" type="button">Sign In</button>
      </div>
      <button id="signOutBtn" type="button" style="display:none">Sign in as someone else</button>
    </div>
  </div>

  <div id="page"></div>

  <script src="/vendor/supabase-js-2.39.3.min.js"></script>
  <script>
    const SLUG = 'justin-gilbertson-hours';
    const sb = window.supabase.createClient(
      'https://aphrrfprbixmhissnjfn.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwaHJyZnByYml4bWhpc3NuamZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5MzA0MjUsImV4cCI6MjA4NTUwNjQyNX0.yYkdQIq97GQgxK7yT2OQEPi5Tt-a7gM45aF8xjSD6wk'
    );
    const $ = id => document.getElementById(id);

    function showError(msg) { $('authError').textContent = msg; $('authError').style.display = 'block'; }
    function showGate(signedInEmail) {
      $('page').innerHTML = '';
      $('gate').classList.remove('hidden');
      $('loginControls').style.display = signedInEmail ? 'none' : 'block';
      $('signOutBtn').style.display = signedInEmail ? 'block' : 'none';
      $('gateMsg').textContent = signedInEmail
        ? `Signed in as ${signedInEmail}, which doesn't have access to this page.`
        : 'Sign in to view this page.';
    }

    let shownFor = null;  // getSession and SIGNED_IN both fire after an OAuth redirect
    async function load(session) {
      if (!session) return showGate(null);
      if (shownFor === session.user.id) return;
      // RLS returns the row only if this user's email is allow-listed.
      const { data, error } = await sb.from('private_page_content')
        .select('title, css, html').eq('slug', SLUG).maybeSingle();
      if (error) { showGate(null); return showError(error.message); }
      if (!data) return showGate(session.user.email);

      shownFor = session.user.id;
      document.title = data.title;
      const style = document.createElement('style');
      style.textContent = data.css;
      document.head.appendChild(style);
      $('gate').classList.add('hidden');
      const bar = document.createElement('div');
      bar.className = 'signed-in-bar';
      bar.innerHTML = `Signed in as <strong></strong> · <button type="button">Sign out</button>`;
      bar.querySelector('strong').textContent = session.user.email;
      bar.querySelector('button').onclick = signOut;
      $('page').replaceChildren(bar);
      $('page').insertAdjacentHTML('beforeend', data.html);
    }

    async function signOut() { await sb.auth.signOut(); shownFor = null; showGate(null); }

    $('googleBtn').onclick = async () => {
      $('googleBtn').disabled = true;
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: location.href.split('#')[0].split('?')[0], queryParams: { prompt: 'select_account' } },
      });
      $('googleBtn').disabled = false;
      if (error) showError(error.message);
    };

    $('authSubmit').onclick = async () => {
      const email = $('authEmail').value.trim(), password = $('authPassword').value;
      $('authError').style.display = 'none';
      if (!email || !password) return showError('Enter email and password.');
      $('authSubmit').disabled = true;
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      $('authSubmit').disabled = false;
      if (error) return showError(error.message);
      load(data.session);  // no-op if SIGNED_IN already rendered it
    };
    $('authPassword').addEventListener('keydown', e => { if (e.key === 'Enter') $('authSubmit').click(); });
    $('signOutBtn').onclick = signOut;

    sb.auth.getSession().then(({ data: { session } }) => load(session));
    sb.auth.onAuthStateChange((event, session) => { if (event === 'SIGNED_IN') load(session); });
  </script>
</body>
</html>
