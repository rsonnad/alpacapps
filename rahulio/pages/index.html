<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahulio's Pages</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles/site.css">
    <link rel="stylesheet" href="/styles/tailwind.out.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #faf9f6;
            color: #1c1618;
            min-height: 100vh;
            padding: 3rem 1.5rem;
        }
        .container { max-width: 640px; margin: 0 auto; }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #1c1618;
        }
        .pages-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .pages-list li a {
            display: block;
            padding: 0.875rem 1rem;
            background: #fff;
            border: 1px solid #e8e4df;
            border-radius: 8px;
            text-decoration: none;
            color: #1c1618;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .pages-list li a:hover {
            border-color: #d4883a;
            box-shadow: 0 2px 8px rgba(212, 136, 58, 0.12);
        }
        .page-title {
            font-weight: 600;
            font-size: 1rem;
        }
        .page-path {
            font-size: 0.8rem;
            color: #8a7f76;
            margin-top: 0.2rem;
        }
        .page-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.2rem;
        }
        .page-date {
            font-size: 0.75rem;
            color: #a89f96;
            white-space: nowrap;
        }
        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8a7f76;
            margin: 1.5rem 0 0.5rem;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <span data-site-version style="display:none;">v260309.20 3:04p</span>
    <div id="siteHeader"></div>

    <div class="container">
        <h1>Rahulio's Pages</h1>
        <p id="pages-meta" class="page-path" style="margin-bottom:1rem;"></p>
        <div id="pages-root"></div>
        <noscript>
            <p>Enable JavaScript to see the full list, or run <code>node scripts/rahulio-pages-manifest.js</code> and refresh.</p>
        </noscript>
    </div>

    <script src="/vendor/supabase-js-2.39.3.min.js"></script>
    <script type="module" src="/shared/version-info.js"></script>
    <script type="module">
        import { initPublicPage } from '/shared/public-shell.js';
        initPublicPage({ transparent: true, light: true });
    </script>
    <script type="module">
        (function () {
            const root = document.getElementById('pages-root');
            const meta = document.getElementById('pages-meta');
            const manifestUrl = 'pages-manifest.json';

            function escapeHtml(s) {
                const div = document.createElement('div');
                div.textContent = s;
                return div.innerHTML;
            }

            function formatDate(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
            }

            function render(manifest) {
                const entries = manifest.entries || [];
                // Build section order from manifest (data-driven)
                const sectionOrder = [null, ...(manifest.sections || [])];
                const bySection = {};
                for (const e of entries) {
                    const key = e.section != null ? e.section : '';
                    if (!bySection[key]) bySection[key] = [];
                    bySection[key].push(e);
                }
                let html = '';
                for (const section of sectionOrder) {
                    const key = section == null ? '' : section;
                    const list = bySection[key] || [];
                    if (list.length === 0) continue;
                    if (section) html += '<div class="section-label">' + escapeHtml(section) + '</div>';
                    html += '<ul class="pages-list">';
                    for (const e of list) {
                        const dateStr = formatDate(e.modifiedAt);
                        html += '<li><a href="' + escapeHtml(e.path) + '">' +
                            '<div class="page-title">' + escapeHtml(e.title) + '</div>' +
                            '<div class="page-meta">' +
                              '<span class="page-path">' + escapeHtml(e.path) + '</span>' +
                              (dateStr ? '<span class="page-date">' + escapeHtml(dateStr) + '</span>' : '') +
                            '</div></a></li>';
                    }
                    html += '</ul>';
                }
                root.innerHTML = html;

                if (manifest.generatedAt) {
                    const d = new Date(manifest.generatedAt);
                    meta.textContent = 'List built ' + d.toLocaleDateString(undefined, { dateStyle: 'medium' }) + '. New pages auto-update on each deploy.';
                }
            }

            fetch(manifestUrl)
                .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error(r.statusText)); })
                .then(function (manifest) {
                    render(manifest);
                })
                .catch(function (err) {
                    root.innerHTML = '<p class="page-path">Could not load page list. Run <code>node scripts/rahulio-pages-manifest.js</code> in the repo and redeploy, then refresh.</p>';
                    meta.textContent = '';
                });
        })();
    </script>
</body>
</html>
