<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | You Are Warned</title>
<style>
:root{--bg:#f5f5f7;--page:#fff;--fg:#16181d;--muted:#5c6270;--rule:#e2e4e9;--brand:#1e2a52;--ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0e1014;--page:#171a20;--fg:#eceef2;--muted:#a0a6b4;--rule:#282c35;--brand:#3a4a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--ui)}main{max-width:42rem;margin:12vh auto;padding:2rem;background:var(--page);border:1px solid var(--rule);border-top:4px solid var(--brand);border-radius:12px}h1{margin:0 0 .5rem;font-size:1.8rem}p{color:var(--muted)}a{color:var(--brand);font-weight:650}
</style>
</head>
<body><main><h1>Page not found</h1><p>The address may be incorrect or the page may have moved.</p><a href="/">Return to You Are Warned</a></main></body>
</html>
